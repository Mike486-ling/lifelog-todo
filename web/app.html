<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<title>今日待办</title>
<style>
:root{
  --bg:#0e0f13;--card:#181c24;--card2:#222833;--line:#2b3240;
  --txt:#e6eaf2;--dim:#8b94a6;--dim2:#5d6675;
  --study:#4a8cff;--life:#ff9f43;--sport:#34d399;--long:#a78bfa;--danger:#ff5f5f;
  --line2:#3f4a5e;--raise:#171b23;--raise2:#0f131a;--raise3:#212835;
  --track:#232a36;--navbg:rgba(17,20,26,.96);--sheetbg:#151922;--toastbg:#2a3344;
  --selbg:#2b3444;--selbd:#3c4a60;--seltxt:#eaf1ff;--seltxt2:#9fc0ff;
  --heat0:#1b212c;--heatfut:#141821;--hdfade:rgba(14,15,19,.86);
}
/* 浅色主题：只覆盖变量，组件不用改 */
html.black{
  --bg:#000;--card:#0c0c0e;--card2:#141418;--line:#1e1e24;--txt:#e8ebf2;--dim:#7c8496;
  --dim2:#555c6b;--line2:#2a2a33;--raise:#08080a;--raise2:#060608;--raise3:#141419;
  --track:#1a1a20;--navbg:rgba(0,0,0,.94);--sheetbg:#050506;--toastbg:#1a1a22;
  --selbg:#0e1a2e;--selbd:#2b4a7a;--seltxt:#dbe8ff;--seltxt2:#9fc0ff;
  --heat0:#111114;--heatfut:#08080a;--hdfade:rgba(0,0,0,.86)
}
html.light{
  --bg:#f4f5f8;--card:#ffffff;--card2:#eef1f6;--line:#e2e6ee;--txt:#171a21;
  --dim:#59616f;--dim2:#8b93a3;--line2:#c3cad6;--raise:#eff2f7;--raise2:#f7f8fb;
  --raise3:#e9edf4;--track:#e4e8ef;--navbg:rgba(255,255,255,.97);--sheetbg:#ffffff;
  --selbg:#dbe6ff;--selbd:#8fb2f5;--seltxt:#1b3d7a;--seltxt2:#2f63c9;
  --heat0:#e8ebf1;--heatfut:#f4f6f9;--hdfade:rgba(244,245,248,.9);
}
html.light .cd{color:#5b45a8;background:#efecff;border-color:#d9d2f7}
html.light .cd.soon{color:#8a5a10;background:#fdf1dd;border-color:#f0dcb4}
html.light .cd.over{color:#a63a3a;background:#fdeaea;border-color:#f3cccc}
html.light .b-del{background:#fdeaea;color:#c0392b}
html.light .drag-ghost{background:var(--sheetbg);border-color:#4a8cff;
  box-shadow:0 16px 34px -12px rgba(0,0,0,.28),0 0 0 1px #4a8cff}
html.light .row.dragging{box-shadow:0 10px 24px -14px rgba(0,0,0,.4),0 0 0 1px #4a8cff}
html.light .toast{color:#fff}
html.light .fab{box-shadow:0 8px 22px -8px rgba(74,140,255,.55)}
/* 浅色下热度要反过来：越忙越深，否则白底看不见 */
html.light .hc.l1{background:#cfe0f7}
html.light .hc.l2{background:#a3c4ee}
html.light .hc.l3{background:#6c9cd8}
html.light .hc.l4{background:#3b6cb3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-size:16px;
  font-family:-apple-system,"Noto Sans SC","PingFang SC",system-ui,sans-serif;
  overscroll-behavior-y:contain}
html{background:var(--bg)}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
/* 单手模式：整页缩到 62%，钉在右下角，四周留出明显边 */
html.onehand{background:#05070c}
/* 上蓝下紫两块高对比留边，交界处一条亮线，一眼看出面板边界 */
html.onehand::before{content:"";position:fixed;left:0;right:0;top:0;height:15%;background:linear-gradient(180deg,#0f3b6b,#12325a);z-index:0}
html.onehand::after{content:"";position:fixed;left:0;top:15%;bottom:0;width:15%;background:linear-gradient(90deg,#2c1a52,#221541);z-index:0}
/* 所有内容装进 #stage；平时 display:contents 等于不存在，单手时它才是那个缩放的盒子。
   这样侧栏、导航、弹层的定位基准都是 #stage，不会再跑到屏幕另一边。 */
#stage{display:contents}
html.onehand #stage{display:block;position:fixed;inset:6px;z-index:1;
  transform:scale(.85);transform-origin:100% 100%;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  background:var(--bg);border:2px solid #5aa2ff;border-radius:16px;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  box-shadow:0 14px 44px -14px #000,0 0 0 3px rgba(90,162,255,.28),0 0 40px -10px rgba(90,162,255,.35)}
html.onehand nav{border-radius:0 0 14px 14px}
header{position:sticky;top:0;z-index:10;padding:16px 16px 12px;
  background:linear-gradient(180deg,var(--bg) 70%,var(--hdfade));backdrop-filter:blur(10px)}
.h-top{display:flex;align-items:center;gap:10px}
.menu-btn{width:38px;height:38px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);
  background:var(--raise);color:var(--txt);font-size:17px;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center;font-family:inherit}
.h-title{font-size:22px;font-weight:700;letter-spacing:.3px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-date{font-size:13px;color:var(--dim)}
.h-sub{font-size:13px;color:var(--dim);margin-top:6px}
.bar{height:6px;border-radius:99px;background:var(--track);margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4a8cff,#34d399);transition:width .35s}
.dates{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 4px;
  padding:0 16px 2px;-webkit-overflow-scrolling:touch}
.dates::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;min-width:52px;background:var(--raise);border:1px solid var(--line);border-radius:12px;
  color:var(--dim);padding:7px 8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:inherit;position:relative}
.dchip b{font-size:13.5px;font-weight:600;line-height:1.15;white-space:nowrap}
.dchip span{font-size:10.5px;color:var(--dim2)}
.dchip.on{background:var(--selbg);border-color:#4a8cff;color:var(--seltxt)}
.dchip.on span{color:var(--seltxt2)}
.dchip .has{position:absolute;top:5px;right:6px;width:4px;height:4px;border-radius:99px;background:#4a8cff}
.tools{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--dim);
  border-radius:99px;padding:7px 13px;font-size:13px}
.chip:active{background:var(--card2)}
.chip.on{background:var(--selbg);color:var(--seltxt);border-color:var(--selbd)}
main{padding:4px 16px 24px}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);margin:0 2px 10px}
.sec-h b{font-weight:600;color:var(--txt)}
.sec-h b.od{color:var(--danger)}
.sec-h .cnt{color:var(--dim2)}
.row{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:13px 12px 13px 16px;margin-bottom:9px;position:relative;overflow:hidden;
  transition:transform .12s,opacity .2s,box-shadow .15s;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pdot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:8px;
  vertical-align:middle;position:relative;top:-1px;box-shadow:0 0 6px -1px currentColor}
.colors{display:flex;gap:8px}
.colors button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--raise2);
  color:var(--dim);font-size:13.5px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.colors button i{width:10px;height:10px;border-radius:99px;display:inline-block}
.colors button.on{background:var(--raise3);color:var(--txt);border-color:#42506a}
.row.sel{box-shadow:0 0 0 2px var(--study) inset,0 0 0 1px var(--study);background:var(--raise)}
html.selecting .row .chk{opacity:.35}
html.selecting .fab{transform:translateY(140px);opacity:0;pointer-events:none}
.fab{transition:transform .18s ease,opacity .18s ease}
.hist{display:flex;flex-direction:column;gap:5px;margin:2px 0 12px}
.hrow{display:flex;gap:8px;font-size:11.5px;color:var(--dim2)}
.hrow span{color:var(--dim);flex:0 0 44px}
.wkbig .b{padding:12px 12px 14px;border-radius:13px}
.wkbig .b strong{font-size:26px;line-height:1.2}
.wkbig .b em{font-size:11px}
.wkspark{display:flex;align-items:flex-end;gap:7px;height:52px;padding:0 3px;margin-top:4px}
.wkspark i{flex:1;display:block;border-radius:5px 5px 3px 3px;background:var(--raise3);min-height:4px}
#selbar{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:31;
  display:flex;align-items:center;gap:7px;padding:9px 11px;border-radius:15px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 12px 30px -12px #000}
#selbar .ck{font-size:12px;color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#selbar button{font-family:inherit;font-size:12.5px;padding:7px 10px;border-radius:9px;
  border:1px solid var(--line2);background:var(--raise);color:var(--txt);flex:0 0 auto}
#selbar button.pri{background:var(--study);border-color:var(--study);color:#fff}
#selbar button.danger{color:var(--danger)}
.row.swiping{transition:none!important;background:var(--raise2);box-shadow:none;
  will-change:transform;z-index:3;position:relative}
.row{touch-action:pan-y}
.row.dragging{opacity:.92;transform:scale(1.015);box-shadow:0 10px 28px -10px #000,0 0 0 1px #4a8cff;
  touch-action:none;z-index:5}
.row.shift{transition:transform .15s}
.row:active{transform:scale(.985)}
.swdel{position:absolute;top:0;bottom:0;right:-72px;width:72px;border:0;padding:0;display:none;
  border-radius:0 13px 13px 0;background:var(--danger);color:#fff;font-family:inherit;
  font-size:13.5px;letter-spacing:1px;align-items:center;justify-content:center}
/* 左滑＝整张卡片平移，红色按钮藏在行内右侧的框外；只有露出时才允许溢出，否则按钮被裁掉 */
.row.rev{transform:translate3d(-72px,0,0);overflow:visible;z-index:2}
.row.swiping{overflow:visible}
.row.rev .swdel,.row.revdir .swdel{display:flex}
.row.done{opacity:.45}
.chk{flex:0 0 auto;width:26px;height:26px;border-radius:9px;border:2px solid var(--line2);
  background:transparent;margin-top:1px;display:flex;align-items:center;justify-content:center;
  padding:0;transition:all .15s;color:transparent;font-size:15px}
.row.done .chk{background:var(--sport);border-color:var(--sport);color:#08120e}
.mid{flex:1;min-width:0}
.tt{font-size:16px;line-height:1.35;word-break:break-word}
.row.done .tt{text-decoration:line-through}
.meta{font-size:12px;color:var(--dim);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{width:7px;height:7px;border-radius:99px;display:inline-block}
.od{color:var(--danger);font-weight:600}
.row.carried .ttx{color:var(--dim)}
.repcarry{color:#f5a524;border:1px solid rgba(245,165,36,.35);background:rgba(245,165,36,.10);
  border-radius:7px;padding:1px 6px;margin-right:2px}
.todaytag{color:#7fb0ff;border:1px solid rgba(127,176,255,.35);border-radius:7px;padding:1px 6px}
.mini.carrymore{display:block;width:100%;margin-top:6px}
.more{flex:0 0 auto;width:32px;height:32px;border:none;background:transparent;color:var(--dim2);font-size:18px;line-height:1;padding:0}
.empty{color:var(--dim2);font-size:14px;text-align:center;padding:34px 10px;line-height:1.8}
.tpl{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.tpl-h{font-size:11.5px;color:var(--dim2);margin-bottom:9px;text-align:center}
.plist{max-height:46vh;overflow-y:auto;margin-top:12px;display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:9px;background:var(--raise2);border:1px solid var(--line);
  border-radius:10px;padding:9px 10px;font-size:13px}
.prow input{width:17px;height:17px;flex:0 0 auto;accent-color:#4a8cff}
.prow .pt{flex:1;min-width:0;word-break:break-word}
.prow .pv{font-size:10.5px;color:var(--dim2);flex:0 0 auto}
.ringrow{display:flex;align-items:center;gap:7px;margin-bottom:12px}
.ringrow span{flex:1;min-width:0;font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{border:1px solid var(--line);background:var(--raise);color:var(--dim);font-family:inherit;
  font-size:11px;padding:3px 9px;border-radius:99px;line-height:1.5}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:11px}
.lcard.done{opacity:.5}
.lcard .lt{font-size:16px;font-weight:600;display:flex;gap:9px;align-items:flex-start}
.lnote{font-size:13.5px;color:var(--dim);margin:8px 0 0;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cd{display:inline-block;margin-top:11px;font-size:12.5px;color:#c3b3ff;background:#241f38;
  border:1px solid #37305a;border-radius:99px;padding:5px 11px}
.cd.soon{color:#ffd08a;background:#2e2317;border-color:#4a3823}
.cd.over{color:#ffb3b3;background:#301b1b;border-color:#4d2626}
.drawer-mask{position:fixed;inset:0;z-index:60;background:#000a;opacity:0;pointer-events:none;transition:opacity .22s}
.drawer-mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;z-index:61;width:78%;max-width:320px;
  background:var(--sheetbg);box-shadow:12px 0 34px -18px #000;
  transform:translateX(-102%);transition:transform .26s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}
.drawer.on{transform:translateX(0)}
.dr-head{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.dr-head b{font-size:16.5px}
.dr-head span{font-size:11px;color:var(--dim2);flex:1}
.dr-x{width:30px;height:30px;border-radius:9px;border:none;background:var(--raise3);color:var(--dim);
  font-size:14px;padding:0;font-family:inherit}
.dr-sec{margin-bottom:15px}
.dr-sec>h4{margin:0 0 7px 2px;font-size:11.5px;color:var(--dim2);font-weight:500;letter-spacing:.4px}
.dr-row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font-family:inherit;
  background:var(--raise2);border:1px solid var(--line);border-radius:11px;
  padding:10px 11px;margin-bottom:6px;color:var(--txt);font-size:13.5px}
.dr-row:active{background:var(--raise3)}
.dr-row .k{flex:1;min-width:0}
.dr-row .v{font-size:11.5px;color:var(--dim2);flex:0 0 auto}
.dr-row .ok{font-size:11.5px;color:var(--sport);flex:0 0 auto}
.dr-row .no{font-size:11.5px;color:var(--danger);flex:0 0 auto}
.dr-big{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.dr-big div{background:var(--raise2);border:1px solid var(--line);border-radius:11px;padding:9px 5px;text-align:center}
.dr-big b{display:block;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.25}
.dr-big em{font-style:normal;font-size:10.5px;color:var(--dim2)}
.dr-theme{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.dr-theme button{border:1px solid var(--line);background:var(--raise2);color:var(--dim);
  border-radius:10px;padding:9px 4px;font-size:12.5px;font-family:inherit}
.dr-theme button.on{background:var(--selbg);border-color:var(--selbd);color:var(--seltxt)}
.dr-foot{font-size:10.5px;color:var(--dim2);line-height:1.7;margin-top:auto;padding-top:10px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  background:var(--navbg);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{flex:1;background:none;border:none;color:var(--dim2);font-size:12px;padding:8px 2px 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit}
nav button .ic{width:22px;height:22px;border-radius:7px;background:var(--raise);transition:all .18s}
nav button.on{color:var(--txt)}
nav button.on .ic{background:var(--ac,#4a8cff);box-shadow:0 0 14px -2px var(--ac,#4a8cff)}
nav button[data-tab="today"]{--ac:#4a8cff}
nav button[data-tab="study"]{--ac:var(--study)}
nav button[data-tab="life"]{--ac:var(--life)}
nav button[data-tab="sport"]{--ac:var(--sport)}
nav button[data-tab="long"]{--ac:var(--long)}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:31;
  width:56px;height:56px;border-radius:50%;border:none;background:#4a8cff;color:#fff;font-size:30px;
  line-height:1;box-shadow:0 8px 24px -6px #4a8cff99}
.fab:active{transform:scale(.94)}
.sheet-mask{position:fixed;inset:0;z-index:49;background:#000a;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--sheetbg);border-radius:20px 20px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(102%);
  transition:transform .26s cubic-bezier(.22,1,.36,1);max-height:90vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sh-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:9px;
  background:var(--sheetbg);margin:-18px -18px 4px;padding:13px 18px 9px;
  border-bottom:1px solid var(--line)}
.sh-x,.sh-dot{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--raise2);color:var(--dim);font-size:15px;font-family:inherit;padding:0;cursor:pointer}
.sh-t{font-size:15px;font-weight:600;flex:1}
.sh-save{flex:0 0 auto;padding:9px 17px;border:none;border-radius:11px;font-size:14.5px;font-weight:600}
.big-in{display:block;width:100%;border:0;background:transparent;color:var(--txt);
  font-family:inherit;font-size:17.5px;font-weight:600;padding:10px 0 6px;outline:none}
.big-in::placeholder{color:var(--dim2);font-weight:400}
.sheet .cats{margin-top:12px}
.more-btn{display:flex;align-items:center;gap:8px;width:100%;margin-top:14px;
  border:1px solid var(--line);background:var(--raise2);color:var(--dim);
  border-radius:12px;padding:11px 12px;font-family:inherit;font-size:13.5px;cursor:pointer}
.more-btn .ms{color:#7fb0ff;font-size:12.5px;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis;flex:1;text-align:left}
.more-btn i{font-style:normal;transition:transform .18s;color:var(--dim2)}
.more-btn.on i{transform:rotate(180deg)}
#moreWrap{display:none;padding-top:2px}
#moreWrap.on{display:block}
#fQuick{margin-top:10px}
.shmenu{display:none;position:fixed;top:56px;right:16px;z-index:52;min-width:132px;
  background:var(--raise);border:1px solid var(--line2);border-radius:13px;
  padding:6px;box-shadow:0 16px 40px -14px #000}
.shmenu.on{display:block}
.shmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;
  color:var(--txt);font-family:inherit;font-size:14px;padding:11px 12px;border-radius:9px}
.shmenu button:active{background:var(--raise3)}
.shmenu button.dan{color:var(--danger)}
/* ---------- 长期详情页 v3.0 ---------- */
#detail{position:fixed;inset:0;z-index:45;background:var(--bg);display:none;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
#detail.on{display:block}
html.dopen,html.dopen body{overflow:hidden}
/* 顶栏：封面区是透明浮钮，滚过封面后收成毛玻璃条并渐显标题 */
.dbar{position:fixed;left:0;right:0;top:0;z-index:8;display:flex;align-items:center;gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;pointer-events:none}
.dbar-bg{position:absolute;inset:0;background:var(--navbg);opacity:0;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid transparent;transition:opacity .18s ease,border-color .18s}
.dbar.solid .dbar-bg{opacity:1;border-bottom-color:var(--line)}
.dbar-t{position:relative;z-index:1;flex:1;min-width:0;text-align:center;font-size:15px;font-weight:600;color:var(--txt);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;
  transform:translateY(4px);transition:opacity .18s,transform .18s}
.dbar.titled .dbar-t{opacity:1;transform:none}
.dico{pointer-events:auto;position:relative;z-index:1;color:#fff;width:38px;height:38px;
  border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(14,17,23,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;
  transition:background .16s,border-color .16s}
.dico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.dico:active{background:rgba(46,53,66,.92)}
html.light .dico{color:#171a21;background:rgba(255,255,255,.86);border-color:rgba(0,0,0,.08)}
html.light .dbar.solid .dico{background:var(--raise);border-color:var(--line)}
/* 封面：38vh + 底部渐隐 + 圆点右下 */
.dhero{position:relative;background:#0b0e14}
.dswipe{display:flex;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.dswipe::-webkit-scrollbar{display:none}
.dswipe>img{flex:0 0 100%;width:100%;height:auto;max-height:38vh;object-fit:cover;display:block;
  scroll-snap-align:center;scroll-snap-stop:always;cursor:zoom-in}
.dhero-fade{position:absolute;left:0;right:0;bottom:0;height:76px;pointer-events:none;
  background:linear-gradient(180deg,transparent,var(--bg))}
.dpts{position:absolute;right:16px;bottom:14px;z-index:2;display:flex;align-items:center;
  gap:5px;padding:5px 9px;border-radius:99px;background:rgba(10,13,19,.5);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dpts i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.42);transition:all .18s}
.dpts i.on{background:#fff;width:14px;border-radius:3px}
/* 正文 */
.dbody{padding:14px 18px calc(40px + env(safe-area-inset-bottom))}
.dbody.nohero{padding-top:calc(70px + env(safe-area-inset-top))}
.dkind{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);
  background:var(--raise2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;
  letter-spacing:.2px}
.dkind .em{font-size:13px}
#detail .dh1{display:block;width:100%;margin:10px 0 0;padding:0;border:0;background:transparent;
  color:var(--txt);font-family:inherit;font-size:22px;font-weight:700;line-height:1.34;
  resize:none;overflow:hidden;min-height:30px}
#detail .dh1::placeholder{color:var(--dim2)}
#detail .dh1:focus{background:var(--raise2);outline:1px solid var(--line);border-radius:12px;
  padding:6px 8px;margin:4px -8px 0;width:calc(100% + 16px)}
/* 三档状态：一行胶囊 */
.dpills{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0 0}
.dpills button{border:1px solid var(--line);background:transparent;color:var(--dim);
  border-radius:99px;padding:7px 15px;font-size:13px;font-family:inherit;cursor:pointer;
  transition:background .16s,color .16s,border-color .16s}
.dpills button.on{background:rgba(167,139,250,.16);border-color:rgba(167,139,250,.5);
  color:#c9b8ff;font-weight:600}
html.light .dpills button.on{background:#efecff;border-color:#d9d2f7;color:#5b45a8}
/* 评分 + 元信息 */
.drate{display:flex;align-items:center;gap:14px;margin:18px 0 0;padding:0 0 16px;
  border-bottom:1px solid var(--line)}
.dscoreb{display:flex;align-items:baseline;gap:3px;border:0;background:transparent;padding:0;
  font-family:inherit;cursor:pointer;flex:0 0 auto}
.dscoreb b{font-size:34px;line-height:1;font-weight:800;color:#ffc93c;letter-spacing:-.5px}
.dscoreb i{font-style:normal;font-size:12.5px;color:var(--dim2)}
.dscoreb.none b{color:var(--dim2)}
.dscoreb b.dempty{font-size:15px;font-weight:600;color:var(--dim2);letter-spacing:0}
.dr-meta{flex:1;min-width:0}
.dmeta{font-size:12.5px;color:var(--dim);line-height:1.75}
.dmeta .sep{color:var(--dim2);margin:0 6px}
.dr-hint{font-size:11.5px;color:var(--dim2);margin-top:3px}
.drpanel{display:none;align-items:center;gap:12px;margin:14px 0 0}
.drpanel.on{display:flex}
.drpanel input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:22px;
  background:transparent;margin:0}
.drpanel input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:99px;
  background:var(--track)}
.drpanel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
  border-radius:50%;background:#ffc93c;margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.drpanel .rnum{font-size:12px;color:var(--dim);min-width:52px;text-align:right}
/* 分区 */
.dsec{margin-top:22px}
.dsec-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);
  margin-bottom:10px;font-weight:600;letter-spacing:.5px}
.dsec-h .cnt{color:var(--dim2);font-weight:400}
/* 备注：正文排版 + 8 行折叠 */
.dnote-wrap{position:relative}
#detail .dnote{display:block;width:100%;border:0;background:transparent;color:var(--txt);
  font-family:inherit;font-size:15px;line-height:1.75;resize:none;overflow:hidden;
  padding:0;min-height:26px;transition:background .16s}
#detail .dnote::placeholder{color:var(--dim2)}
#detail .dnote:focus{background:var(--raise2);outline:1px solid var(--line);border-radius:10px;
  padding:8px 10px;margin-left:-10px;margin-right:-10px;width:calc(100% + 20px)}
.dnote-wrap.folded .dnote{max-height:calc(1.75em * 8);overflow:hidden}
.dnote-wrap.folded::after{content:"";position:absolute;left:0;right:0;bottom:0;height:36px;
  pointer-events:none;background:linear-gradient(180deg,transparent,var(--bg))}
.dnote-tog{display:none;margin:6px 0 0;border:0;background:transparent;color:var(--seltxt2);
  font-size:12.5px;font-family:inherit;padding:4px 0;cursor:pointer}
.dnote-tog.on{display:inline-block}
/* 卡片：子任务 / 足迹 */
.dcard{margin-top:8px;background:var(--raise2);border:1px solid var(--line);
  border-radius:14px;padding:2px 14px}
.dsub{display:flex;align-items:flex-start;gap:11px;padding:12px 0;font-size:14.5px;
  border-bottom:1px solid var(--line);cursor:pointer}
.dsub:last-child{border-bottom:0}
.dsub .box{flex:0 0 auto;width:19px;height:19px;border-radius:6px;
  border:1.8px solid var(--line2);display:flex;align-items:center;justify-content:center;
  font-size:10px;color:transparent;margin-top:2px}
.dsub.done .box{background:var(--sport);border-color:var(--sport);color:#08120e}
.dsub.done .txt{color:var(--dim);text-decoration:line-through}
.dsub .txt{flex:1;min-width:0;word-break:break-word;line-height:1.5}
.dtl-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:12.5px;
  color:var(--dim)}
.dtl-item i{font-style:normal;font-size:11.5px;color:var(--dim2);flex:0 0 44px;
  font-variant-numeric:tabular-nums;padding-top:1px}
.dtl-item .dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;
  background:var(--line2);margin-top:6px}
.dtl-item span{line-height:1.6}
dialog.dmenu{position:fixed;left:0;right:0;top:auto;bottom:0;width:100%;max-width:100%;
  margin:0;border:0;border-radius:22px 22px 0 0;background:var(--sheetbg);color:var(--txt);
  padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
dialog.dmenu::backdrop{background:rgba(0,0,0,.62)}
dialog.dmenu .grab{width:36px;height:4px;border-radius:99px;background:var(--line2);
  margin:0 auto 10px}
dialog.dmenu button{display:block;width:100%;text-align:left;padding:15px 10px;border:0;
  background:transparent;color:var(--txt);font-size:16px;font-family:inherit;
  border-radius:12px;cursor:pointer}
dialog.dmenu button:active{background:var(--raise3)}
dialog.dmenu button.dan{color:var(--danger)}
.sheet h3{margin:0 0 14px;font-size:17px}
label.f{display:block;font-size:12.5px;color:var(--dim);margin:14px 0 6px}
input[type=text],input[type=date],input[type=time],textarea,select{
  width:100%;background:var(--raise2);border:1px solid var(--line);border-radius:11px;color:var(--txt);
  padding:12px;font-size:16px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--selbd)}
textarea{resize:vertical;min-height:64px;line-height:1.55}
.dtrow{display:flex;gap:9px}
.dtrow input[type=date]{flex:1.35}
.twrap{position:relative;flex:1}
.twrap input[type=time]{width:100%;color:transparent}
.twrap.filled input[type=time]{color:var(--txt)}
.twrap .ph{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;
  color:var(--dim2);pointer-events:none;white-space:nowrap}
.twrap.filled .ph{display:none}

/* ---------- 任务配图 ---------- */
.imgadd{display:block;width:100%;margin-top:8px;padding:12px;border-radius:11px;
  border:1px dashed var(--line2);background:transparent;color:var(--dim);
  font-size:13.5px;font-family:inherit;text-align:center;cursor:pointer}
.imgadd:active{background:var(--raise2);color:var(--txt)}
.imgadd[disabled]{opacity:.6}
.imgcard{display:flex;gap:10px;align-items:center;margin-top:8px;background:var(--raise2);
  border:1px solid var(--line);border-radius:12px;padding:8px}
.imgcard>img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#0b0e14;
  flex:0 0 auto;cursor:zoom-in}
.imgcard .meta{flex:1;min-width:0;font-size:11.5px;color:var(--dim);line-height:1.55}
.imgcard .name{color:var(--txt);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imgcard .err{color:#ff6b6b;font-size:12.5px}
.imgcard .acts{flex:0 0 auto;display:flex;gap:6px}
.imgx{flex:0 0 auto;min-width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--dim);font-size:13.5px;padding:0 9px;cursor:pointer;font-family:inherit}
.tt{display:flex;align-items:flex-start;gap:8px}
.ttx{flex:1;min-width:0;word-break:break-word}
.rowthumb{width:26px;height:26px;border-radius:6px;object-fit:cover;flex:0 0 auto;
  background:#0b0e14;cursor:zoom-in}
.lthumb{width:44px;height:44px;border-radius:10px;margin-top:-2px}
.ithumb{position:relative;flex:0 0 auto}
.ibadge{position:absolute;right:-4px;bottom:-2px;background:rgba(0,0,0,.72);color:#fff;
  font-size:10px;border-radius:7px;padding:0 5px;line-height:15px;pointer-events:none}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.icell{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#0b0e14}
.icell img{width:100%;height:100%;object-fit:cover;display:block}
.icell .ix{position:absolute;right:5px;top:5px;width:23px;height:23px;border-radius:50%;
  border:0;background:rgba(0,0,0,.62);color:#fff;font-size:12px;line-height:23px;padding:0;
  cursor:pointer;font-family:inherit}
.icell .inm{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 4px;font-size:10px;
  color:#cfd6e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(transparent,rgba(0,0,0,.72))}
.lm{flex:1;min-width:0}
.ltt{font-size:16px;font-weight:600;line-height:1.35;word-break:break-word}
.lmeta{margin-top:4px}
.lb{display:inline-block;font-size:11px;color:var(--dim);background:var(--raise2);
  border-radius:6px;padding:1px 6px;line-height:1.6}
.lfoot{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.lrate{display:inline-flex;align-items:center;gap:5px}
.lrate em{font-style:normal;font-size:11.5px;color:#f5a524}
.lscore{display:inline-flex;align-items:baseline;gap:2px;font-size:13.5px;font-weight:700;color:#ffc93c}
.lscore em{font-style:normal;font-size:10.5px;font-weight:500;color:#8b94a6}
.lnote{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lnote.on{display:block;overflow:visible}
.ntog{display:block;margin:-2px 0 6px;border:0;background:transparent;color:var(--seltxt2);
  font-size:12.5px;font-family:inherit;padding:4px 0;cursor:pointer}
.raterow input[type=number]{flex:0 0 108px;width:108px;text-align:center;font-size:17px;font-weight:600}
.stars{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;cursor:pointer}
.stars .st{position:relative;display:block;width:15px;height:15px}
.stars .st svg{display:block;width:100%;height:100%;overflow:visible}
.stars .st .e path{fill:#232a35;stroke:#313a49;stroke-width:1.5;stroke-linejoin:round}
.stars .st .f{position:absolute;left:0;top:0;width:100%;height:100%}
.stars .st .f.half{clip-path:inset(0 50% 0 0)}
.stars .st .f .g{display:block;width:100%;height:100%}
.stars .st .f .g path{fill:url(#sgold);stroke:#ffd06a;stroke-width:1.3;stroke-linejoin:round}
.stars.big{gap:6px}
.stars.big .st{width:34px;height:34px}
.raterow{display:flex;align-items:center;gap:12px;margin-top:2px}
.raterow .rnum{font-size:13px;color:var(--dim);flex:0 0 auto;white-space:nowrap}
.kindrow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.kindrow::-webkit-scrollbar{display:none}
.kindrow button{flex:0 0 auto;border:1px solid var(--line);background:var(--raise2);
  color:var(--dim);border-radius:99px;padding:7px 12px;font-size:13px;font-family:inherit}
.kindrow button.on{background:var(--selbg);color:var(--seltxt);border-color:var(--selbd);font-weight:600}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px 4px;border-radius:11px;border:1px solid var(--line);
  background:var(--raise2);color:var(--dim);font-size:14px;font-family:inherit}
.seg button.on{background:#4a8cff;color:#fff;border-color:transparent;font-weight:600}
.imgfull{position:fixed;inset:0;z-index:70;background:#000;display:none;
  align-items:center;justify-content:center}
.imgfull.on{display:flex}
.imgfull>img{max-width:100vw;max-height:100vh;object-fit:contain}
.imgfull .bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(0,0,0,.78))}
.imgfull .cap{flex:1;min-width:0;font-size:12px;color:#b9c0cd;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.imgfull .bar button{flex:0 0 auto;padding:9px 16px;border-radius:11px;border:none;
  font-size:14px;font-family:inherit;font-weight:600}
.quick{display:flex;gap:7px;margin-top:9px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:0 0 auto;background:var(--raise2);border:1px solid var(--line);color:var(--dim);
  border-radius:8px;padding:7px 11px;font-size:12.5px;font-family:inherit}
.quick button:active{background:#212835;color:var(--txt)}
.quick button.on{background:var(--selbg);color:var(--seltxt);border-color:var(--selbd)}
.quick.early{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;overflow:visible}
.quick.early>button{font-size:12px;padding:9px 2px;text-align:center}
.cats{display:flex;gap:8px}
.cats button{flex:1;padding:11px 4px;border-radius:11px;border:1px solid var(--line);background:var(--raise2);
  color:var(--dim);font-size:14px;font-family:inherit;transition:all .15s}
.cats button.on{color:#08101c;font-weight:600;border-color:transparent}
.cats button[data-cat="study"].on{background:var(--study)}
.cats button[data-cat="life"].on{background:var(--life)}
.cats button[data-cat="sport"].on{background:var(--sport)}
.cats button[data-cat="long"].on{background:var(--long)}
.btns{display:flex;gap:10px;margin-top:20px}
.btns button{flex:1;padding:14px;border-radius:13px;border:none;font-size:15.5px;font-family:inherit;font-weight:600}
.b-main{background:#4a8cff;color:#fff}
.b-ghost{background:var(--raise3);color:var(--txt)}
.b-del{background:#3a1e22;color:#ff8a8a;flex:0 0 84px}
.hint{font-size:12px;color:var(--dim2);line-height:1.7;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:var(--toastbg);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:99px;opacity:0;
  transition:all .25s;z-index:60;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 18px;
  border-radius:16px;text-align:left}
.toast.act button{border:none;background:#4a8cff;color:#fff;font-size:13px;font-family:inherit;
  padding:8px 14px;border-radius:99px;white-space:nowrap}
.toast.act button:active{opacity:.8}
@keyframes chkpop{0%{transform:scale(.75)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes rowin{0%{opacity:.35;transform:translateY(-4px)}100%{opacity:.45;transform:none}}
.row.just-checked .chk{animation:chkpop .34s cubic-bezier(.34,1.56,.64,1)}
.row.just-checked{animation:rowin .34s ease-out}
@keyframes barflash{0%{filter:brightness(1.85) saturate(1.3)}100%{filter:none}}
.bar>i.bump{animation:barflash .55s ease-out}
dialog{border:none;background:var(--sheetbg);color:var(--txt);border-radius:18px;padding:20px;width:88vw;max-width:420px}
dialog::backdrop{background:#000a}

/* ---------- 拖动把手 / 悬浮层 ---------- */
.grip{flex:0 0 auto;align-self:center;width:12px;color:var(--dim2);font-size:12px;line-height:1;
  letter-spacing:-1px;pointer-events:none;user-select:none;-webkit-user-select:none;text-align:center}
.row.ghost-on{opacity:.22;filter:grayscale(.5)}
.row.ghost-on .grip{color:transparent}
.drag-ghost{position:fixed;z-index:70;margin:0!important;pointer-events:none;
  background:var(--raise3);border-color:#4a8cff;box-shadow:0 18px 40px -10px #000,0 0 0 1px #4a8cff99;
  opacity:.98;will-change:transform;transform-origin:50% 50%}
.drag-ghost .grip{color:#7fb0ff}

/* ---------- 统计面板 ---------- */
.panel-mask{position:fixed;inset:0;z-index:50;background:#000b;opacity:0;pointer-events:none;transition:opacity .22s}
.panel-mask.on{opacity:1;pointer-events:auto}
.panel{position:fixed;inset:0;z-index:51;background:var(--bg);transform:translateY(102%);
  transition:transform .3s cubic-bezier(.22,1,.36,1);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
.panel.on{transform:translateY(0)}
.p-head{display:flex;align-items:center;gap:10px}
.p-head h2{margin:0;font-size:19px;flex:1}
.p-x{border:none;background:var(--raise3);color:var(--dim);width:34px;height:34px;border-radius:10px;font-size:15px;font-family:inherit}
.ybar{display:flex;align-items:center;justify-content:center;gap:16px;margin:12px 0 16px}
.ybar button{border:1px solid var(--line);background:var(--card);color:var(--dim);width:40px;height:34px;
  border-radius:10px;font-size:15px;font-family:inherit}
.ybar button:disabled{opacity:.28}
.ybar button:not(:disabled){color:var(--txt);background:var(--raise3);border-color:var(--selbd)}
.ybar b{font-size:19px;letter-spacing:.5px;font-variant-numeric:tabular-nums;min-width:88px;text-align:center}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big .b{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.big .b em{display:block;font-size:11.5px;color:var(--dim);font-style:normal;margin-bottom:7px}
.big .b strong{font-size:25px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.big .b i{font-size:11.5px;color:var(--dim2);font-style:normal;margin-left:3px}
.sbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.sbox h4{margin:0 0 12px;font-size:12.5px;color:var(--dim);font-weight:500;display:flex;gap:6px;align-items:center}
.cbar{display:flex;height:11px;border-radius:99px;overflow:hidden;background:var(--raise2);margin-bottom:12px}

<script>
(function(){
'use strict';
var CATS={study:{n:'学习',c:'#4a8cff'},life:{n:'生活',c:'#ff9f43'},sport:{n:'运动',c:'#34d399'},long:{n:'长期',c:'#a78bfa'}};
/* 长期条目的「类型」：13 类，顺序即筛选 chip 顺序；st 是该类型的三档状态文案 */
var LK={
  movie:{n:'影视',e:'🎬',st:['想看','在看','看完']},
  book:{n:'书',e:'📚',st:['想读','在读','读完']},
  music:{n:'音乐',e:'🎵',st:['想听','在听','听完']},
  know:{n:'知识',e:'🧠',st:['想学','在学','学会']},
  person:{n:'人物',e:'👤',st:['想了解','在了解','已了解']},
  game:{n:'游戏',e:'🎮',st:['想玩','在玩','通关']},
  creat:{n:'创作',e:'✍️',st:['想做','在做','做完']},
  place:{n:'地点',e:'📍',st:['想去','计划中','去过']},
  food:{n:'美食',e:'🍜',st:['想吃','计划中','吃过']},
  thing:{n:'好物',e:'🛒',st:['想买','观望','已入手']},
  health:{n:'健康',e:'🩺',st:['想练','在练','达成']},
  idea:{n:'灵感',e:'💡',st:['记下','在琢磨','想通了']},
  other:{n:'其他',e:'🧩',st:['想做','在做','已完成']}
};
var LK_ORDER=['movie','book','music','know','person','game','creat','place','food','thing','health','idea','other'];
var ST_KEYS=['want','doing','done'];
var longSub='all', draftKind='other', draftSt='want', draftRating=0, noteOpen={};
var KEY='ll_tasks_v1', tab='today', filter='today', editing=null, draftCat='study';
var tasks=[], storeOk=true;
var NATIVE=(typeof AndroidHost!=='undefined')?AndroidHost:null;
var APP_VER='3.0.2';
var selDate=today(), rangeA=null, rangeB=null, draftColor='', draftEarly=0, draftSound='', ringNames={}, globalDefaultName='';
var draftRepeat='', draftDow=[], draftDom=0, draftSubs=[], draftMode='alarm';
var draftImgs=[], IMG_MAXN=9, IMG_MAX=10*1024*1024, IMG_BASE='';

function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function fromYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=fromYmd(s);d.setDate(d.getDate()+n);return ymd(d)}
function hmToMs(hm){if(!hm)return 0;var p=hm.split(':');
  return ((+p[0])*60+(+(p[1]||0)))*60000+(+(p[2]||0))*1000}
function fmtT(tm){if(!tm)return '';var p=tm.split(':');
  return p[0]+':'+(p[1]||'00')+((p[2]&&p[2]!=='00')?':'+p[2]:'')}
function tsOf(dateStr,timeStr){if(!dateStr)return null;return fromYmd(dateStr).getTime()+hmToMs(timeStr)}
function syncNative(){
  if(!NATIVE)return;
  var list=[];
  tasks.forEach(function(t){
    if(t.done||!t.remindDate||!t.remindTime)return;
    var at=tsOf(t.remindDate,t.remindTime);
    if(!at)return;
    at-= (t.early||0)*60000;                       /* 提前提醒 */
    if(at<Date.now()){
      if(t.repeat&&t.dueDate<today())return;   /* 顺延那条的提醒点在昨天，别立刻补响 */
      at=Date.now()+1000;
    }
    list.push({id:t.id,sound:(t.sound||globalSound()||''),
      title:(CATS[t.cat]||CATS.study).n+' · '+t.title,
      body:((t.deferred>=3?'已经顺延 '+t.deferred+' 次了，要不要拆小一点？ · ':'')+
        (t.early?'提前 '+(t.early)+' 分钟 · ':'')+
        (t.note||(dayLabel(t.remindDate)+' '+fmtT(t.remindTime)))),
      mode:(t.mode||'alarm'),at:at});
  });
  try{NATIVE.sync(JSON.stringify(list))}catch(e){}
}
/* 原生那边攒下的操作（通知栏点「完成」/「稍后」、收尾通知点「全部顺延」） */
function drainNative(){
  if(!NATIVE)return;
  var changed=false, didDone=0, didDefer=false;
  try{
    if(NATIVE.takeLaunchAct){
      var act=NATIVE.takeLaunchAct();
      if(act==='new'){openSheet(null)}
      else if(act==='stats'){openStats()}
    }
  }catch(e){}
  try{
    if(NATIVE.takeOps){
      var ops=JSON.parse(NATIVE.takeOps()||'[]');
      (ops||[]).forEach(function(o){
        if(!o)return;
        if(o.t==='done'){
          var t=tasks.filter(function(x){return x.id===o.id})[0];
          if(t&&!t.done){t.done=true;t.doneDate=today();t.notified=true;changed=true;didDone++}
        }else if(o.t==='deferall'){
          var t0=today(), nd=addDays(t0,1);
          tasks.forEach(function(x){
            if(x.cat==='long'||x.done||!x.dueDate||x.repeat)return;
            if(x.dueDate>t0)return;
            pushHist(x,'顺延',x.dueDate,nd);
            x.deferred=(x.deferred||0)+1;
            x.origDue=x.origDue||x.dueDate;
            x.dueDate=nd;
            changed=true;didDefer=true;
          });
        }
      });
      if(changed){save();render()}
      if(didDefer)toast('今天剩下的已顺延到明天');
      else if(didDone)toast('已完成 '+didDone+' 条');
    }
  }catch(e){}
}

/* 22:00 收尾：把今天的进度交给原生去发通知 */
function wrapupOn(){try{return localStorage.getItem('ll_wrapup')!=='0'}catch(e){return true}}
function wrapupText(){
  var t=today();
  var list=tasks.filter(function(x){return x.cat!=='long'&&x.dueDate===t});
  var done=list.filter(function(x){return x.done}).length;
  var open=list.length-done;
  if(!list.length)return '今天没有安排，早点休息';
  if(!open)return '今天 '+done+'/'+list.length+' 全部做完了，收工';
  return '今天 '+done+'/'+list.length+' 完成，还有 '+open+' 件没收尾';
}
function syncWrapup(){
  if(!NATIVE||!NATIVE.setWrapup)return;
  try{NATIVE.setWrapup(wrapupOn()?1:0,wrapupText())}catch(e){}
}

/* 零点顺延：过去未完成的任务自动挪到今天 */
function rollover(silent){
  var t=today(), moved=0;
  tasks.forEach(function(x){
    if(x.cat==='long'||x.done||!x.dueDate)return;
    if(x.repeat)return;                      /* 重复任务不挪日期：漏做的那条留作「顺延」 */
    if(x.dueDate<t){
      if(!x.origDue&&x.dueDate!==t)x.origDue=x.dueDate;
      x.dueDate=t;
      x.deferred=(x.deferred||0)+1;
      x.order=Date.now()-500000+moved;   // 顺延上来的排在前面
      moved++;
    }
  });
  if(moved){save();if(!silent)toast(moved+' 项未完成已顺延到今天')}
  return moved;
}
var carryAll=false;
var lastDay=today();
function dayTick(){
  var t=today();
  if(t!==lastDay){lastDay=t;rollover(true);ensureRepeats();render()}
}
function load(){try{var r=localStorage.getItem(KEY);tasks=r?JSON.parse(r)||[]:[]}catch(e){tasks=[];storeOk=false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){storeOk=false}syncNative();syncWrapup();maybeBackup()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---------- 舞台：#stage 包住所有内容，单手模式只缩放它 ---------- */
function stageEl(){return document.getElementById('stage')||document.body}
(function buildStage(){
  if(document.getElementById('stage'))return;
  var st=document.createElement('div');
  st.id='stage';
  while(document.body.firstChild)st.appendChild(document.body.firstChild);
  document.body.appendChild(st);
})();

/* ---------- 外观 / 主题 ---------- */
function themeMode(){try{return localStorage.getItem('ll_theme')||'auto'}catch(e){return 'auto'}}
function applyTheme(){
  var m=themeMode(), light=false;
  if(m==='light')light=true;
  else if(m==='auto'){
    try{light=!!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)}catch(e){}
  }
  document.documentElement.classList.toggle('light',light);
  document.documentElement.classList.toggle('black',m==='black');
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',light?'#f4f5f8':'#0e0f13');
  /* 原生 WebView 底色同步，否则内容不够高时露出的还是深色 */
  if(NATIVE&&NATIVE.setBg){try{NATIVE.setBg(m==='black'?'#000000':(light?'#f4f5f8':'#0e0f13'))}catch(e){}}
}
function syncThemeBtns(){
  var m=themeMode();
  [].forEach.call(document.querySelectorAll('#themeRow button'),function(b){
    b.classList.toggle('on',b.dataset.theme===m);
  });
}
function setTheme(m){
  try{localStorage.setItem('ll_theme',m)}catch(e){}
  applyTheme();syncThemeBtns();
  if(drawerOpen)renderDrawer();
}
try{
  var themeMq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)');
  if(themeMq){
    var onThemeChange=function(){if(themeMode()==='auto')applyTheme()};
    if(themeMq.addEventListener)themeMq.addEventListener('change',onThemeChange);
    else if(themeMq.addListener)themeMq.addListener(onThemeChange);
  }
}catch(e){}

function dayLabel(ds){
  var t=today();
  if(ds===t)return '今天';
  if(ds===addDays(t,1))return '明天';
  if(ds===addDays(t,-1))return '昨天';
  var d=fromYmd(ds);
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function overDays(ds){
  var a=fromYmd(today()).getTime(), b=fromYmd(ds).getTime();
  return Math.max(1,Math.round((a-b)/86400000));
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- 日期条 ---------- */
function ensureRange(){
  if(!rangeA||selDate<rangeA||selDate>rangeB){
    rangeA=addDays(selDate,-90);
    rangeB=addDays(selDate,180);
  }
}
function md(ds){var p=ds.split('-');return (+p[1])+'/'+(+p[2])}
function wdOf(ds){return ['周日','周一','周二','周三','周四','周五','周六'][fromYmd(ds).getDay()]}
function dayTitle(ds){
  var t=today();
  if(ds===t)return '今天';
  if(ds===addDays(t,1))return '明天';
  if(ds===addDays(t,2))return '后天';
  if(ds===addDays(t,-1))return '昨天';
  var d=fromYmd(ds);
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function countMap(){
  var m={};
  tasks.forEach(function(x){
    if(x.cat==='long'||!x.dueDate)return;
    m[x.dueDate]=(m[x.dueDate]||0)+1;
  });
  return m;
}
function datesHtml(){
  ensureRange();
  var cm=countMap(), t=today(), h='';
  for(var ds=rangeA; ds<=rangeB; ds=addDays(ds,1)){
    var lbl = (ds===t||ds===addDays(t,1)||ds===addDays(t,2)||ds===addDays(t,-1))
      ? dayTitle(ds) : md(ds);
    var dot = cm[ds] ? '<i class="has"></i>' : '';
    h+='<button class="dchip'+(ds===selDate?' on':'')+'" data-date="'+ds+'">'+dot+
       '<b>'+lbl+'</b><span>'+wdOf(ds)+'</span></button>';
  }
  return '<div class="dates" id="dates">'+h+'</div>';
}
function selectDate(ds){
  selDate=ds;
  render();
  centerActive();
}
function centerActive(){
  var box=document.getElementById('dates');
  if(!box)return;
  var on=box.querySelector('.dchip.on');
  if(on)box.scrollLeft=on.offsetLeft-box.clientWidth/2+on.offsetWidth/2;
}
function openJump(){
  var d=document.createElement('dialog');
  d.innerHTML='<h3 style="margin:0 0 4px">跳到某一天</h3>'+
    '<div class="hint" style="margin-top:2px">选好后点「跳过去」，日期条会滚到那天。</div>'+
    '<label class="f">日期</label><input type="date" id="jDate" value="'+selDate+'">'+
    '<div class="quick" style="margin-top:12px">'+
    '<button data-j="-365">一年前</button><button data-j="-30">30 天前</button>'+
    '<button data-j="-7">7 天前</button><button data-j="0">今天</button>'+
    '<button data-j="7">7 天后</button><button data-j="30">30 天后</button>'+
    '</div>'+
    '<div class="btns"><button class="b-main" id="jGo">跳过去</button>'+
    '<button class="b-ghost" id="jCancel">取消</button></div>';
  stageEl().appendChild(d);
  try{d.showModal()}catch(e){d.setAttribute("open","")}
  d.querySelector('#jGo').onclick=function(){
    var v=d.querySelector('#jDate').value;
    if(v){selectDate(v)}
    d.close();d.remove();
  };
  d.querySelector('#jCancel').onclick=function(){d.close();d.remove()};
  [].forEach.call(d.querySelectorAll('[data-j]'),function(b){
    b.onclick=function(){
      var n=+b.dataset.j;
      var ds = n===0? today() : addDays(today(),n);
      d.querySelector('#jDate').value=ds;
      selectDate(ds);
      d.close();d.remove();
    };
  });
}

       '<button class="chip" data-act="search">🔍 搜索</button>'+

    h+='<div class="tools">'+

var PIN={'red':'#ff4d4f','amber':'#f5a524','green':'#34d399'};
function prioDot(t,rank,total){
  var c=t.color||'';
  var r=1;
  if(!c){
    var ratio=(total&&total>1)?(rank/(total-1)):0;
    c = ratio<0.34?'red' : ratio<0.7?'amber' : 'green';
    r = Math.max(0.5,1-ratio*0.5);
  }
  return '<i class="pdot" style="background:'+PIN[c]+';color:'+PIN[c]+';opacity:'+r.toFixed(2)+'"></i>';
}
function rowHtml(t,rank,total,extra){
  extra=extra||{};
  var bar='';
  var c=CATS[t.cat]||CATS.study;
  var meta='';
  if(extra.carry)meta+='<span class="repcarry">⟲ 顺延 '+overDays(t.dueDate)+' 天 · 原定 '+dayLabel(t.dueDate)+'</span>';
  meta+='<span class="dot" style="background:'+c.c+'"></span>'+c.n;
  if(t.dueDate&&!extra.carry){
    var lbl=dayLabel(t.dueDate)+(t.dueTime?' '+fmtT(t.dueTime):'');
    if(!t.done&&t.dueDate<today()) meta+='<span class="od">逾期'+overDays(t.dueDate)+'天 · '+lbl+'</span>';
    else meta+='<span>'+lbl+'</span>';
  }
  if(t.deferred) meta+='<span>顺延'+t.deferred+'次</span>';
  if(t.remindDate&&t.remindTime) meta+='<span>⏰'+(t.remindDate===today()?'':(t.remindDate.slice(5))+' ')+fmtT(t.remindTime)+
    (t.early?' <span style="color:#7fb0ff">提前'+t.early+'分</span>':'')+
    (t.mode==='silent'?' <span style="color:#8b94a7">静音</span>':t.mode==='vibrate'?' <span style="color:#8b94a7">震动</span>':'')+'</span>';
  if(t.repeat) meta+='<span style="color:#7fb0ff">🔁'+repLabel(t.repeat)+'</span>';
  if(extra.todayTag) meta+='<span class="todaytag">今日</span>';
  var subBlock='';
  if(t.subs&&t.subs.length){
    var sd=t.subs.filter(function(x){return x.done}).length;
    var sOpen=(t.subsOpen!==false);
    meta+='<span class="subbar" data-subtoggle="'+t.id+'">'+sd+'/'+t.subs.length+
      '<i><b style="width:'+Math.round(sd/t.subs.length*100)+'%"></b></i>'+(sOpen?'▾':'▸')+'</span>';
    if(sOpen){
      subBlock='<div class="subrows">'+t.subs.map(function(sb){
        return '<div class="subrow'+(sb.done?' done':'')+'">'+
          '<button class="schk" data-subchk="'+t.id+':'+sb.id+'">✓</button>'+
          '<span class="st">'+esc(sb.text)+'</span></div>';
      }).join('')+'</div>';
    }
  }
  if(t.note) meta+='<span>📝</span>';
  if(rank!=null)bar=prioDot(t,rank,total);
  return '<div class="row'+(t.done?' done':'')+(subBlock?' has-subs':'')+(extra.carry?' carried':'')+'" data-id="'+t.id+'">'+
    '<button class="chk" data-chk="'+t.id+'">✓</button>'+
    '<div class="mid"><div class="tt">'+bar+'<span class="ttx">'+esc(t.title)+'</span>'+
      (t.img&&t.img.id?'<img class="rowthumb" data-img="'+t.id+'" data-att="'+t.img.id+'|'+t.img.ext+'|1" src="'+imgUrl(t.img,true)+'" alt="">':'')+
      '</div><div class="meta">'+meta+'</div>'+subBlock+'</div>'+
    (t.done?'':'<span class="grip">⋮⋮</span>')+
    '<button class="more" data-edit="'+t.id+'">⋯</button>'+
    '<button class="swdel" data-swb="'+t.id+'">删除</button></div>';
}

function ordOf(t){return (t.order!=null?t.order:(t.createdAt||0))}
function byOrder(a,b){
  var x=ordOf(a), y=ordOf(b);
  if(x!==y)return x<y?-1:1;
  return byDue(a,b);
}
function byDue(a,b){
  var x=a.dueDate||'9999', y=b.dueDate||'9999';
  if(x!==y)return x<y?-1:1;
  return (a.dueTime||'99:99')<(b.dueTime||'99:99')?-1:1;
}

/* ---------- 最近搜索 ---------- */
function recentQ(){
  try{var r=JSON.parse(localStorage.getItem('ll_recent_q')||'[]');return Array.isArray(r)?r:[]}catch(e){return []}
}
function pushRecentQ(q){
  q=(q||'').trim();
  if(q.length<2)return;
  var r=recentQ().filter(function(x){return x!==q});
  r.unshift(q);
  try{localStorage.setItem('ll_recent_q',JSON.stringify(r.slice(0,5)))}catch(e){}
}

function renderToday(){
  var t=today(), s=selDate;
  var planned=tasks.filter(function(x){return x.cat!=='long'&&x.dueDate===s});
  var open=planned.filter(function(x){return !x.done}).sort(byOrder);
  var closed=planned.filter(function(x){return x.done});
  var doneOnDay=tasks.filter(function(x){return x.cat!=='long'&&x.done&&x.doneDate===s&&x.dueDate!==s});
  var undated=tasks.filter(function(x){return x.cat!=='long'&&!x.done&&!x.dueDate});
  var h='';
  /* 逾期：夜里顺延过来的，和本来就过了日期的，单独一块，别混在当天安排里 */
  /* 只有看「今天」时，顺延过来的才算「逾期」；看别的日期它们就是普通安排 */
  var over=(s===t)?open.filter(function(x){return x.deferred>0||(x.origDue&&x.origDue<s)}):[];
  /* 重复任务漏做的那几条：日期还留在过去，单独进「顺延」区（最多先露 3 条） */
  var carry=(s===t)?tasks.filter(function(x){
      return x.cat!=='long'&&x.repeat&&!x.done&&x.dueDate&&x.dueDate<s;
    }).sort(function(a,b){return a.dueDate<b.dueDate?-1:(a.dueDate>b.dueDate?1:0)}):[];
  var fresh=open.filter(function(x){return over.indexOf(x)<0});
  var CARRY_MAX=carryAll?99:3;
  var carryShow=carry.slice(0,CARRY_MAX), carryMore=carry.length-carryShow.length;
  if(carry.length||over.length){
    var ototal=carry.length+over.length;
    h+='<div class="sec" data-sec="over"><div class="sec-h"><b class="od">顺延</b><span class="cnt">'+ototal+'</span>'+
       (over.length?'<button class="mini" data-act="clearover" style="margin-left:auto">转入今天</button>':'')+'</div>';
    h+=carryShow.map(function(x){return rowHtml(x,null,null,{carry:1})}).join('');
    if(carryMore)h+='<button class="mini carrymore" data-act="carryall">还有 '+carryMore+' 天未做 · 展开</button>';
    h+=over.map(function(x,i){return rowHtml(x,i,over.length)}).join('');
    h+='</div>';
  }
  if(fresh.length){
    var isPast=s<t;
    h+='<div class="sec" data-sec="open"><div class="sec-h"><b'+(isPast?' class="od"':'')+'>'+(isPast?'当天未完成':'当天安排')+'</b><span class="cnt">'+fresh.length+'</span>'+
       (selecting?'':'<button class="mini" data-act="batch" style="margin-left:auto">☑️ 批量</button>')+'</div>';
    h+=fresh.map(function(x,i){return rowHtml(x,i,fresh.length,{todayTag:!!(x.repeat&&carry.length)})}).join('');
    h+='</div>';
  }else{
    h+='<div class="sec" data-sec="open"><div class="sec-h"><b>'+(s<t?'当天记录':'当天安排')+'</b><span class="cnt">0</span></div>'+
       '<div class="empty">'+(s===t?'今天还没有安排<br>点右下角 ＋ 加一条'
         :(s<t?'这一天没有记录':'这一天还没有安排<br>点 ＋ 给它加一条'))+'</div>'+
       (tasks.length? '':tplHtml())+'</div>';
  }
  var allDone=closed.concat(doneOnDay).sort(byDue);
  if(allDone.length){
    h+='<div class="sec" data-sec="done"><div class="sec-h"><b>'+(s===t?'今天完成':'当天完成')+'</b><span class="cnt">'+allDone.length+'</span></div>'+
       allDone.map(function(x){return rowHtml(x)}).join('')+'</div>';
  }
  if(s===t&&undated.length){
    h+='<div class="sec" data-sec="undated"><div class="sec-h"><b>未定期</b><span class="cnt">'+undated.length+'</span></div>'+
       undated.sort(byOrder).map(function(x){return rowHtml(x,null)}).join('')+'</div>';
  }
  return h;
}

function renderCat(){
  var cat=tab, t=today(), list;
  if(filter==='today') list=tasks.filter(function(x){return x.cat===cat&&x.dueDate===t});
  else if(filter==='week'){
    var end=addDays(t,6);
    list=tasks.filter(function(x){return x.cat===cat&&x.dueDate&&x.dueDate>=t&&x.dueDate<=end});
  } else list=tasks.filter(function(x){return x.cat===cat});
  list=list.slice().sort(function(a,b){if(a.done!==b.done)return a.done?1:-1;return byOrder(a,b)});
  var h='<div class="sec">';
  var openCnt=list.filter(function(x){return !x.done}).length;
  h+= list.length? list.map(function(x,i){return rowHtml(x,x.done?null:i,openCnt)}).join('')
    : '<div class="empty">这个分类还没有任务<br>点 ＋ 添加</div>';
  h+='</div>';
  return h;
}

/* 只重画某一行里的子任务块 + 进度条 */
function patchSubRow(t){
  var row=document.querySelector('#view .row[data-id="'+t.id+'"]');
  if(!row||!t.subs||!t.subs.length)return false;
  var sd=t.subs.filter(function(x){return x.done}).length;
  var bar=row.querySelector('.subbar');
  if(!bar)return false;
  var old=row.querySelector('.subrows');
  var open=(t.subsOpen!==false);
  bar.innerHTML=sd+'/'+t.subs.length+'<i><b style="width:'+Math.round(sd/t.subs.length*100)+'%"></b></i>'+(open?'▾':'▸');
  var html='';
  if(open){
    html='<div class="subrows">'+t.subs.map(function(sb){
      return '<div class="subrow'+(sb.done?' done':'')+'">'+
        '<button class="schk" data-subchk="'+t.id+':'+sb.id+'">✓</button>'+
        '<span class="st">'+esc(sb.text)+'</span></div>';
    }).join('')+'</div>';
  }
  if(old)old.outerHTML=html;
  else if(html)row.querySelector('.mid').insertAdjacentHTML('beforeend',html);
  return true;
}

/* ---------- 局部刷新：只动一行，不重建整页 ---------- */
function secOf(name){return document.querySelector('#view .sec[data-sec="'+name+'"]')}
function secCnt(el){var c=el&&el.querySelector('.sec-h .cnt');return c}
function bumpCnt(el,d){
  var c=secCnt(el);
  if(c)c.textContent=Math.max(0,(+c.textContent||0)+d);
}
/* 把行按 order 插进目标分区（放在第一个"比它大"的行前面） */
function insertByOrder(sec,row){
  var id=row.dataset.id;
  var t=tasks.find(function(x){return x.id===id});
  var rows=[].slice.call(sec.children).filter(function(n){return n.classList&&n.classList.contains('row')});
  var ref=null;
  for(var i=0;i<rows.length;i++){
    var o=tasks.find(function(x){return x.id===rows[i].dataset.id});
    if(o&&t&&ordOf(o)>ordOf(t)){ref=rows[i];break}
  }
  sec.insertBefore(row,ref||null);
}
/* 勾选/取消勾选时尽量只更新这一行，返回 false 表示需要整页重绘 */
function fastToggle(id){
  if(tab!=='today')return false;
  var t=tasks.find(function(x){return x.id===id});
  if(!t)return false;
  var row=document.querySelector('#view .row[data-id="'+id+'"]');
  if(!row)return false;
  var openSec=secOf('open'), doneSec=secOf('done');
  if(t.done){
    if(!doneSec){                       /* 还没有"完成"分区，建一个 */
      doneSec=document.createElement('div');
      doneSec.className='sec';
      doneSec.setAttribute('data-sec','done');

var DOW_CN=['日','一','二','三','四','五','六'];
function repLabel(r){
  if(!r)return '';
  if(r.type==='daily')return '每天';
  if(r.type==='weekly'){
    var d=(r.dow&&r.dow.length?r.dow.slice():[]).sort();
    return '每周'+d.map(function(x){return DOW_CN[x]}).join('');
  }
  if(r.type==='monthly')return '每月'+(r.dom||1)+'号';
  return '';
}
function nextRepeatDate(r,base){
  var b=fromYmd(base||today());
  if(r.type==='daily'){
    b.setDate(b.getDate()+1);return ymd(b);
  }
  if(r.type==='weekly'){
    var dows=(r.dow&&r.dow.length)?r.dow:[b.getDay()], i, d;
    for(i=1;i<=14;i++){
      d=new Date(b.getTime()+i*86400000);
      if(dows.indexOf(d.getDay())>=0)return ymd(d);
    }
    return ymd(new Date(b.getTime()+7*86400000));
  }
  if(r.type==='monthly'){
    var dom=r.dom||b.getDate();
    for(var k=1;k<=13;k++){
      var mm=b.getMonth()+1+k, yy=b.getFullYear();
      while(mm>12){mm-=12;yy++}
      var dim=new Date(yy,mm,0).getDate();
      var cand=yy+'-'+pad(mm)+'-'+pad(Math.min(dom,dim));
      if(cand>base)return cand;
    }
  }
  return addDays(base||today(),1);
}
function spawnRepeat(t){
  var base=t.dueDate||today();
  var nd=nextRepeatDate(t.repeat,base);
  var nt=JSON.parse(JSON.stringify(t));
  nt.id=uid();nt.createdAt=Date.now();nt.order=Date.now();
  nt.done=false;delete nt.doneDate;delete nt.spawned;delete nt.notified;
  nt.dueDate=nd;
  if(t.remindDate&&t.dueDate){
    var delta=Math.round((fromYmd(nd)-fromYmd(t.dueDate))/86400000);
    nt.remindDate=addDays(t.remindDate,delta);
  }else if(t.remindDate){
    nt.remindDate=nd;
  }
  if(nt.subs&&nt.subs.length){
    nt.subs=nt.subs.map(function(x){return {id:uid(),text:x.text,done:false}});
  }
  nt.series=seriesOf(t);
  delete nt.deferred;delete nt.origDue;delete nt.carryOf;delete nt.seeded;
  tasks.push(nt);
  t.spawned=nt.id;
  return nt;
}

/* ---------- 重复任务：系列 / 每日补齐 ----------
   语义：repeat 任务每天都该有一条「今日」实例；漏做的那条原地不动，成为「顺延」。
   所以漏做一天 → 今天看到两条：顺延（写着原定日期）+ 今日。 */
function seriesOf(t){return t.series||t.id}
function repHitDay(r,ds){
  if(!r)return false;
  var d=fromYmd(ds);
  if(r.type==='daily')return true;
  if(r.type==='weekly'){
    var dows=(r.dow&&r.dow.length)?r.dow:[d.getDay()];
    return dows.indexOf(d.getDay())>=0;
  }
  if(r.type==='monthly'){
    var dom=r.dom||1, dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    return d.getDate()===Math.min(dom,dim);
  }
  return false;
}
function repSkipMap(){try{return JSON.parse(localStorage.getItem('ll_rep_skip')||'{}')||{}}catch(e){return {}}}
function repSkipMark(sid,ds){
  var m=repSkipMap(), a=m[sid]||[];
  if(a.indexOf(ds)<0)a.push(ds);
  m[sid]=a.slice(-5);
  try{localStorage.setItem('ll_rep_skip',JSON.stringify(m))}catch(e){}
}
/* 撤销删除时擦掉墓碑，否则那天的实例以后永远不补种 */
function repSkipUnmark(sid,ds){
  var m=repSkipMap(), a=m[sid];
  if(!a||a.indexOf(ds)<0)return;
  a=a.filter(function(x){return x!==ds});
  if(a.length)m[sid]=a; else delete m[sid];
  try{localStorage.setItem('ll_rep_skip',JSON.stringify(m))}catch(e){}
}
function migrateRepeat(){
  var ch=false;
  tasks.forEach(function(t){
    if(!t.repeat)return;
    if(!t.series){t.series=t.id;ch=true}
  });
  if(ch)save();
}
/* 系列里比 t 更晚的那条（用来判断要不要再生成） */
function laterSibling(t){
  var sid=seriesOf(t);
  var cand=tasks.filter(function(x){
    return x.repeat&&seriesOf(x)===sid&&(x.dueDate||'')>(t.dueDate||'');
  }).sort(function(a,b){return (a.dueDate||'')<(b.dueDate||'')?-1:1});
  return cand[0]||null;
}
/* 给每个重复系列补齐「今天 / 明天」两条实例；被用户删掉的当天不补 */
function ensureRepeats(){
  var t=today(), tm=addDays(t,1), skip=repSkipMap(), added=0, groups={};
  tasks.forEach(function(x){
    if(x.cat==='long'||!x.repeat)return;
    var sid=seriesOf(x);
    if(!x.series)x.series=sid;
    (groups[sid]=groups[sid]||[]).push(x);
  });
  Object.keys(groups).forEach(function(sid){
    var list=groups[sid].slice().sort(function(a,b){
      return (a.dueDate||'')<(b.dueDate||'')?-1:((a.dueDate||'')>(b.dueDate||'')?1:0)});
    var last=list[list.length-1], rule=last&&last.repeat;
    if(!rule)return;
    var start=list[0].dueDate||'';          /* 系列还没开始（下周一才起的每天），别提前补 */
    [t,tm].forEach(function(ds){
      if(!repHitDay(rule,ds))return;
      if(start&&ds<start)return;
      if(ds===t&&(skip[sid]||[]).indexOf(ds)>=0)return;
      if(list.some(function(x){return x.dueDate===ds}))return;
      var nt=JSON.parse(JSON.stringify(last));
      nt.id=uid();nt.createdAt=Date.now();nt.order=Date.now()+(ds===tm?1:0);
      nt.series=sid;nt.seeded=1;nt.done=false;nt.dueDate=ds;
      if(nt.st)nt.st='want';
      delete nt.doneDate;delete nt.spawned;delete nt.notified;
      delete nt.deferred;delete nt.origDue;delete nt.carryOf;
      if(last.remindTime)nt.remindDate=ds;else delete nt.remindDate;
      if(nt.subs&&nt.subs.length)nt.subs=nt.subs.map(function(x){return {id:uid(),text:x.text,done:false}});
      tasks.push(nt);list.push(nt);added++;
    });
  });
  if(added)save();
  return added;
}

/* ---------- 快速添加解析 ---------- */
var CN_N={'零':0,'一':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12};
function cnNum(x){if(/^\d+$/.test(x))return +x;return CN_N[x]==null?null:CN_N[x]}
function parseQuick(raw){
  var s=' '+(raw||'')+' ', out={date:'',time:'',cat:'',clean:'',pills:[]}, m;
  // 相对日
  m=/(大后天|大前天|今天|明天|后天|昨天|前天)/.exec(s);
  if(m){
    var off={'大后天':3,'后天':2,'明天':1,'今天':0,'昨天':-1,'前天':-2,'大前天':-3}[m[1]];
    out.date=addDays(today(),off);s=s.replace(m[0],' ');
  }else if((m=/(下)?(?:周|星期|礼拜)([一二三四五六日天])/.exec(s))){
    var map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};
    var tgt=(map[m[2]]+6)%7, cur=(fromYmd(today()).getDay()+6)%7;
    var delta=(tgt-cur+7)%7;if(delta===0)delta=7;
    if(m[1])delta+=7;
    out.date=addDays(today(),delta);s=s.replace(m[0],' ');
  }else if((m=/(\d{1,2}|[一二三四五六七八九十]{1,3})月(\d{1,2}|[一二三四五六七八九十]{1,3})(?:日|号)/.exec(s))){
    var mo=cnNum(m[1]),dd=cnNum(m[2]);
    if(mo&&dd){
      var y=+today().slice(0,4), cand=y+'-'+pad(mo)+'-'+pad(dd);
      if(cand<today())cand=(y+1)+'-'+pad(mo)+'-'+pad(dd);
      out.date=cand;s=s.replace(m[0],' ');
    }
  }
  // N 分钟后 / 小时后
  if((m=/(\d{1,3})\s*分钟(?:后|以后|之后)/.exec(s))){
    var t1=new Date(Date.now()+(+m[1])*60000);
    out.date=ymd(t1);out.time=pad(t1.getHours())+':'+pad(t1.getMinutes());s=s.replace(m[0],' ');
  }else if((m=/(\d{1,3})\s*小时(?:后|以后|之后)/.exec(s))){
    var t2=new Date(Date.now()+(+m[1])*3600000);
    out.date=ymd(t2);out.time=pad(t2.getHours())+':'+pad(t2.getMinutes());s=s.replace(m[0],' ');
  }else if((m=/(早上|上午|中午|下午|傍晚|晚上|凌晨)?\s*(\d{1,2})\s*(?:点|:|：)\s*(\d{1,2})?\s*(半)?/.exec(s))){
    var h=+m[2], mi=m[3]?(+m[3]):(m[4]?30:0), ap=m[1]||'';
    if((ap==='下午'||ap==='傍晚'||ap==='晚上')&&h<12)h+=12;
    if(ap==='中午'&&h<12&&h<11)h+=12;
    if(h>23)h=23;if(mi>59)mi=0;

  }
  // 时长（30 分钟 / 1 小时）不算时间，只从标题去掉
  s=s.replace(/(\d{1,3})\s*(?:分钟|小时|分)(?![后以])/g,' ');
  // 分类关键词
  var KW=[['sport',/跑步|健身|运动|游泳|打球|骑车|锻炼|瑜伽|跳绳/],
          ['study',/读书|学习|背单词|复习|作业|看书|上课|笔记|刷题/],
          ['life',/买菜|购物|收拾|打扫|做饭|洗衣|快递|交费|缴费|理发/]];
  for(var i=0;i<KW.length;i++){if(KW[i][1].test(raw)){out.cat=KW[i][0];break}}
  /* 长期条目的类型 / 状态（只在「长期」分类下生效） */
  out.kind=guessKind(raw);
  out.st='';
  if(/(想看|想读|想听|想学|想玩|想做|想买|想去|想吃|想了解|打算看|计划看|计划读)/.test(raw))out.st='want';
  else if(/(正在看|正在读|正在听|正在学|正在玩|正在做|正在了解|在读|在听|在学|在看|在了解)/.test(raw))out.st='doing';
  else if(/(看完|看过|读完|读过|听完|听过|学会|学完|通关|去过|吃过|已入手|入手了)/.test(raw))out.st='done';
  out.clean=s.replace(/\s+/g,' ').trim();
  if(!out.clean)out.clean=(raw||'').trim();
  if(out.date)out.pills.push(dayTitle(out.date)==='今天'?'今天':(dayTitle(out.date)||out.date));
  if(out.time)out.pills.push(fmtT(out.time));
  if(out.cat)out.pills.push(CATS[out.cat].n);
  if(out.kind&&out.kind!=='other')out.pills.push(LK[out.kind].e+' '+LK[out.kind].n);
  if(out.st)out.pills.push(LK[out.kind||'other'].st[ST_KEYS.indexOf(out.st)]);

function openDMore(t){
  var d=document.createElement('dialog');
  d.className='dmenu';
  d.innerHTML='<div class="grab"></div>'+
    '<button type="button" data-m="edit">编辑</button>'+
    '<button type="button" data-m="share">分享文字卡片</button>'+
    '<button type="button" data-m="del" class="dan">删除</button>';
  document.body.appendChild(d);
  d.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('[data-m]'):null;
    if(!b){
      if(e.target===d){try{d.close()}catch(x){};d.remove()}
      return;
    }
    var m=b.dataset.m;
    try{d.close()}catch(x){}
    d.remove();
    if(m==='edit')openSheet(t);
    else if(m==='share')shareDetail(t);
    else if(m==='del'){deleteTask(t);closeDetail()}
  });
  d.showModal();
}
function renderDetail(){
  var t=detailTask(), d=document.getElementById('detail');
  if(!t||!d)return;
  var lk=lkOf(t), st=stKey(t), im=imgsOf(t), i=ST_KEYS.indexOf(st);
  var seg=ST_KEYS.map(function(k,j){
    return '<button type="button" data-dst="'+k+'"'+(k===st?' class="on"':'')+'>'+lk.st[j]+'</button>';
  }).join('');
  var swipe=im.map(function(x){
    var ar=(x.w>0&&x.h>0)?' style="aspect-ratio:'+x.w+'/'+x.h+'"':'';
    return '<img src="'+imgUrl(x,false)+'" alt="'+esc(x.name||'')+'" data-dimg="'+x.id+'"'+ar+'>';
  }).join('');
  var pts=im.length>1?'<div class="dpts" id="dPts">'+im.map(function(x,j){
      return '<i'+(j===0?' class="on"':'')+'></i>';
    }).join('')+'</div>':'';
  var hero=im.length?'<div class="dhero"><div class="dswipe" id="dSwipe">'+swipe+'</div>'+
    pts+'<div class="dhero-fade"></div></div>':'';
  var meta=[];
  meta.push(t.createdAt?'记于 '+dayLabel(msDay(t.createdAt)):'');
  if(t.doneDate)meta.push(dayLabel(t.doneDate)+' 完成');
  if(t.dueDate)meta.push('目标 '+dayLabel(t.dueDate)+(t.dueTime?' '+fmtT(t.dueTime):''));
  var subsHtml='';

    var sd=t.subs.filter(function(x){return x.done}).length;
    subsHtml='<div class="dsec"><div class="dsec-h">子任务 <span class="cnt">'+sd+'/'+t.subs.length+'</span></div>'+
      '<div class="dcard">'+t.subs.map(function(sb,j){
        return '<div class="dsub'+(sb.done?' done':'')+'" data-dsub="'+j+'">'+
          '<span class="box">✓</span><span class="txt">'+esc(sb.text)+'</span></div>';
      }).join('')+'</div></div>';
  }
  var histHtml='';
  if(t.hist&&t.hist.length){
    histHtml='<div class="dsec"><div class="dsec-h">足迹</div><div class="dcard">'+
      t.hist.slice(-6).reverse().map(function(h){
        return '<div class="dtl-item"><i>'+h.d.slice(5)+'</i><span class="dot"></span>'+
          '<span>'+(h.k==='顺延'?'顺延到 ':'改到 ')+h.t+'</span></div>';
      }).join('')+'</div></div>';
  }
  var rate=t.rating>0?(+t.rating).toFixed(1):'--';
  d.innerHTML=
    '<div class="dbar" id="dBar"><div class="dbar-bg"></div>'+
      '<button type="button" class="dico" data-dback="1" aria-label="返回">'+
        '<svg viewBox="0 0 24 24"><path d="M15 4.5L7.5 12l7.5 7.5"/></svg></button>'+
      '<div class="dbar-t" id="dBarT">'+esc(t.title)+'</div>'+
      '<button type="button" class="dico" data-dmore="1" aria-label="更多">'+dMoreIcon()+'</button>'+
    '</div>'+
    hero+
    '<div class="dbody'+(im.length?'':' nohero')+'">'+
      '<div class="dkind"><span class="em">'+lk.e+'</span>'+lk.n+'</div>'+
      '<textarea class="dh1" id="dTitle" rows="1" placeholder="标题">'+esc(t.title)+'</textarea>'+
      '<div class="dpills">'+seg+'</div>'+
      '<div class="drate">'+
        '<button type="button" class="dscoreb'+(t.rating>0?'':' none')+'" id="dScoreBtn" aria-label="修改评分">'+
          (t.rating>0?'<b id="dRateBig">'+rate+'</b><i>/10</i>':'<b id="dRateBig" class="dempty">未评分</b>')+'</button>'+
        '<div class="dr-meta">'+
          '<div class="dmeta">'+meta.filter(Boolean).join('<span class="sep">·</span>')+'</div>'+
          '<div class="dr-hint" id="dRateHint">'+(t.rating>0?'点数字改分':'点一下打分')+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="drpanel" id="drPanel">'+
        '<input id="dSlider" type="range" min="0" max="10" step="0.1" value="'+(t.rating>0?t.rating:0)+'" aria-label="评分">'+
        '<span class="rnum" id="dRateNum">'+dNum(t.rating)+'</span>'+
      '</div>'+

        '<div class="dnote-wrap" id="dNoteWrap">'+
          '<textarea class="dnote" id="dNote" rows="1" placeholder="写点什么…">'+esc(t.note||'')+'</textarea>'+
        '</div>'+
        '<button type="button" class="dnote-tog" id="dNoteTog">展开</button>'+

function bindDetail(t,d){
  var q=function(sel){return d.querySelector(sel)};
  var all=function(sel){return [].slice.call(d.querySelectorAll(sel))};
  function listLater(){clearTimeout(dListTimer);dListTimer=setTimeout(function(){render()},400)}
  /* 顶栏：滚过封面才收成毛玻璃条；再往下才渐显标题 */
  var bar=q('#dBar');
  if(!d.__dbarBound){
    d.__dbarBound=1;
    d.addEventListener('scroll',function(){if(d.__dbarSync)d.__dbarSync()},{passive:true});
  }
  d.__dbarSync=function(){
    var b=d.querySelector('#dBar');
    if(!b)return;
    var hero=d.querySelector('.dhero'), h1=d.querySelector('#dTitle');
    var heroH=hero?hero.offsetHeight:0;
    var h1b=h1?(h1.offsetTop+h1.offsetHeight):0;
    var y=d.scrollTop||0;
    b.classList.toggle('solid',y>(heroH?heroH-54:16));
    b.classList.toggle('titled',h1b?y>h1b-52:y>120);
  };
  d.__dbarSync();
  q('[data-dback]').onclick=closeDetail;
  q('[data-dmore]').onclick=function(){openDMore(t)};
  all('[data-dst]').forEach(function(b){
    b.onclick=function(){
      var k=b.dataset.dst;
      t.st=k;
      if(k==='done'){t.done=true;if(!t.doneDate)t.doneDate=today()}
      else{t.done=false;t.doneDate=''}
      save();render();redrawDetail();
    };
  });
  /* 轮播：原图左右滑 + 圆点跟随 */
  var sw=q('#dSwipe'), pts=q('#dPts');
  all('[data-dimg]').forEach(function(imEl){
    imEl.addEventListener('load',function(){if(d.__dbarSync)d.__dbarSync()});
    imEl.onclick=function(){
      var x=tasks.filter(function(y){return y.id===detailId})[0];
      var list=imgsOf(x), one=list.filter(function(z){return z.id===imEl.dataset.dimg})[0];
      if(one)openImgView(one);
    };
  });
  if(sw&&pts){
    var syncPts=function(){
      var w=sw.clientWidth||1, idx=Math.round(sw.scrollLeft/w);
      [].forEach.call(pts.children,function(c,j){c.classList.toggle('on',j===idx)});
    };
    sw.addEventListener('scroll',syncPts,{passive:true});
  }
  /* 评分：点数字展开滑杆，滑杆是唯一入口，元信息不再重复分数 */
  var btn=q('#dScoreBtn'), panel=q('#drPanel'), sl=q('#dSlider');
  if(btn&&panel){
    btn.onclick=function(){panel.classList.toggle('on')};
  }
  if(sl){
    sl.addEventListener('input',function(){
      var v=parseFloat(sl.value);
      t.rating=isFinite(v)?Math.round(v*10)/10:0;
      var big=q('#dRateBig'), num=q('#dRateNum'), hint=q('#dRateHint');
      if(big){
        if(t.rating>0){big.classList.remove('dempty');big.textContent=t.rating.toFixed(1)}
        else{big.classList.add('dempty');big.textContent='未评分'}
      }
      if(btn)btn.classList.toggle('none',!(t.rating>0));
      if(num)num.textContent=dNum(t.rating);
      if(hint)hint.textContent=t.rating>0?'点数字改分':'点一下打分';
      clearTimeout(dSaveTimer);dSaveTimer=setTimeout(function(){save();listLater()},500);
    });
    sl.addEventListener('change',function(){save();listLater()});
  }
  /* 标题：textarea 自动换行 + 自动撑高 */
  var ti=q('#dTitle');
  if(ti){
    var tgrow=function(){ti.style.height='auto';ti.style.height=Math.max(30,ti.scrollHeight)+'px'};
    tgrow();
    ti.addEventListener('input',function(){
      t.title=ti.value;tgrow();
      var bt=q('#dBarT');if(bt)bt.textContent=ti.value;
      clearTimeout(dSaveTimer);dSaveTimer=setTimeout(function(){save();listLater()},500);
    });
    ti.addEventListener('change',function(){t.title=ti.value;save();listLater()});
  }
  /* 备注：撑高 + 超 8 行折叠 */
  var no=q('#dNote');
  if(no){
    var wrap=q('#dNoteWrap'), tog=q('#dNoteTog');
    var grow=function(){no.style.height='auto';no.style.height=Math.max(26,no.scrollHeight)+'px'};
    grow();
    var canFold=no.scrollHeight>210;
    var setFold=function(f){
      dNoteOpen=!f;
      if(wrap)wrap.classList.toggle('folded',f);
      if(tog){
        if(canFold)tog.classList.add('on');
        tog.textContent=f?'展开':'收起';
      }
    };
    if(canFold){
      if(tog)tog.classList.add('on');
      setFold(!dNoteOpen);
      if(tog)tog.onclick=function(){setFold(!wrap.classList.contains('folded'))};
    }else if(tog){tog.classList.remove('on')}
    no.addEventListener('focus',function(){
      if(wrap&&wrap.classList.contains('folded'))setFold(false);
    });
    no.addEventListener('input',function(){
      t.note=no.value;grow();
      clearTimeout(dSaveTimer);dSaveTimer=setTimeout(function(){save();listLater()},500);
    });
    no.addEventListener('change',function(){t.note=no.value;save();listLater()});
  }
  all('[data-dsub]').forEach(function(row){
    row.onclick=function(){
      var j=+row.dataset.dsub, sb=t.subs[j];
      if(!sb)return;
      sb.done=!sb.done;
      save();render();redrawDetail();
    };
  });
}
function renderLong(){
  var all=tasks.filter(function(x){return x.cat==='long'});
  if(!all.length) return '<div class="sec"><div class="empty">还没有长期条目<br>电影、书、知识点、想去的地方都能记<br>点 ＋ 记下第一个</div></div>';
  var list=all.filter(function(x){return longSub==='all'||lkKey(x)===longSub});
  if(!list.length) return '<div class="sec"><div class="empty">这个类型下还没有条目</div></div>';
  var labels=longSub==='all'?['想做','在做','已完成']:LK[longSub].st;
  var h='';
  [0,1,2].forEach(function(i){
    var g=list.filter(function(x){return ST_KEYS.indexOf(stKey(x))===i}).sort(byDue);
    if(!g.length)return;
    h+='<div class="sec lgrp"><div class="sec-h"><b>'+labels[i]+'</b><span class="cnt">'+g.length+'</span></div>'+
      g.map(lcardHtml).join('')+'</div>';
  });
  return h;
}
