<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<title>今日待办</title>
<style>
:root{
  --bg:#0e0f13;--card:#181c24;--card2:#222833;--line:#2b3240;
  --txt:#e6eaf2;--dim:#8b94a6;--dim2:#5d6675;
  --study:#4a8cff;--life:#ff9f43;--sport:#34d399;--long:#a78bfa;--danger:#ff5f5f;
  --line2:#3f4a5e;--raise:#171b23;--raise2:#0f131a;--raise3:#212835;
  --track:#232a36;--navbg:rgba(17,20,26,.96);--sheetbg:#151922;--toastbg:#2a3344;
  --selbg:#2b3444;--selbd:#3c4a60;--seltxt:#eaf1ff;--seltxt2:#9fc0ff;
  --heat0:#1b212c;--heatfut:#141821;--hdfade:rgba(14,15,19,.86);
}
/* 浅色主题：只覆盖变量，组件不用改 */
html.black{
  --bg:#000;--card:#0c0c0e;--card2:#141418;--line:#1e1e24;--txt:#e8ebf2;--dim:#7c8496;
  --dim2:#555c6b;--line2:#2a2a33;--raise:#08080a;--raise2:#060608;--raise3:#141419;
  --track:#1a1a20;--navbg:rgba(0,0,0,.94);--sheetbg:#050506;--toastbg:#1a1a22;
  --selbg:#0e1a2e;--selbd:#2b4a7a;--seltxt:#dbe8ff;--seltxt2:#9fc0ff;
  --heat0:#111114;--heatfut:#08080a;--hdfade:rgba(0,0,0,.86)
}
html.light{
  --bg:#f4f5f8;--card:#ffffff;--card2:#eef1f6;--line:#e2e6ee;--txt:#171a21;
  --dim:#59616f;--dim2:#8b93a3;--line2:#c3cad6;--raise:#eff2f7;--raise2:#f7f8fb;
  --raise3:#e9edf4;--track:#e4e8ef;--navbg:rgba(255,255,255,.97);--sheetbg:#ffffff;
  --selbg:#dbe6ff;--selbd:#8fb2f5;--seltxt:#1b3d7a;--seltxt2:#2f63c9;
  --heat0:#e8ebf1;--heatfut:#f4f6f9;--hdfade:rgba(244,245,248,.9);
}
html.light .cd{color:#5b45a8;background:#efecff;border-color:#d9d2f7}
html.light .cd.soon{color:#8a5a10;background:#fdf1dd;border-color:#f0dcb4}
html.light .cd.over{color:#a63a3a;background:#fdeaea;border-color:#f3cccc}
html.light .b-del{background:#fdeaea;color:#c0392b}
html.light .drag-ghost{background:var(--sheetbg);border-color:#4a8cff;
  box-shadow:0 16px 34px -12px rgba(0,0,0,.28),0 0 0 1px #4a8cff}
html.light .row.dragging{box-shadow:0 10px 24px -14px rgba(0,0,0,.4),0 0 0 1px #4a8cff}
html.light .toast{color:#fff}
html.light .fab{box-shadow:0 8px 22px -8px rgba(74,140,255,.55)}
/* 浅色下热度要反过来：越忙越深，否则白底看不见 */
html.light .hc.l1{background:#cfe0f7}
html.light .hc.l2{background:#a3c4ee}
html.light .hc.l3{background:#6c9cd8}
html.light .hc.l4{background:#3b6cb3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-size:16px;
  font-family:-apple-system,"Noto Sans SC","PingFang SC",system-ui,sans-serif;
  overscroll-behavior-y:contain}
html{background:var(--bg)}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
/* 单手模式：整页缩到 62%，钉在右下角，四周留出明显边 */
html.onehand{background:#05070c}
/* 上蓝下紫两块高对比留边，交界处一条亮线，一眼看出面板边界 */
html.onehand::before{content:"";position:fixed;left:0;right:0;top:0;height:15%;background:linear-gradient(180deg,#0f3b6b,#12325a);z-index:0}
html.onehand::after{content:"";position:fixed;left:0;top:15%;bottom:0;width:15%;background:linear-gradient(90deg,#2c1a52,#221541);z-index:0}
/* 所有内容装进 #stage；平时 display:contents 等于不存在，单手时它才是那个缩放的盒子。
   这样侧栏、导航、弹层的定位基准都是 #stage，不会再跑到屏幕另一边。 */
#stage{display:contents}
html.onehand #stage{display:block;position:fixed;inset:6px;z-index:1;
  transform:scale(.85);transform-origin:100% 100%;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  background:var(--bg);border:2px solid #5aa2ff;border-radius:16px;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  box-shadow:0 14px 44px -14px #000,0 0 0 3px rgba(90,162,255,.28),0 0 40px -10px rgba(90,162,255,.35)}
html.onehand nav{border-radius:0 0 14px 14px}
header{position:sticky;top:0;z-index:10;padding:16px 16px 12px;
  background:linear-gradient(180deg,var(--bg) 70%,var(--hdfade));backdrop-filter:blur(10px)}
.h-top{display:flex;align-items:center;gap:10px}
.menu-btn{width:38px;height:38px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);
  background:var(--raise);color:var(--txt);font-size:17px;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center;font-family:inherit}
.h-title{font-size:22px;font-weight:700;letter-spacing:.3px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-date{font-size:13px;color:var(--dim)}
.h-sub{font-size:13px;color:var(--dim);margin-top:6px}
.bar{height:6px;border-radius:99px;background:var(--track);margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4a8cff,#34d399);transition:width .35s}
.dates{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 4px;
  padding:0 16px 2px;-webkit-overflow-scrolling:touch}
.dates::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;min-width:52px;background:var(--raise);border:1px solid var(--line);border-radius:12px;
  color:var(--dim);padding:7px 8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:inherit;position:relative}
.dchip b{font-size:13.5px;font-weight:600;line-height:1.15;white-space:nowrap}
.dchip span{font-size:10.5px;color:var(--dim2)}
.dchip.on{background:var(--selbg);border-color:#4a8cff;color:var(--seltxt)}
.dchip.on span{color:var(--seltxt2)}
.dchip .has{position:absolute;top:5px;right:6px;width:4px;height:4px;border-radius:99px;background:#4a8cff}
.tools{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--dim);
  border-radius:99px;padding:7px 13px;font-size:13px}
.chip:active{background:var(--card2)}
.chip.on{background:var(--selbg);color:var(--seltxt);border-color:var(--selbd)}
main{padding:4px 16px 24px}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);margin:0 2px 10px}
.sec-h b{font-weight:600;color:var(--txt)}
.sec-h b.od{color:var(--danger)}
.sec-h .cnt{color:var(--dim2)}
.row{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:13px 12px 13px 16px;margin-bottom:9px;position:relative;overflow:hidden;
  transition:transform .12s,opacity .2s,box-shadow .15s;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pdot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:8px;
  vertical-align:middle;position:relative;top:-1px;box-shadow:0 0 6px -1px currentColor}
.colors{display:flex;gap:8px}
.colors button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--raise2);
  color:var(--dim);font-size:13.5px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.colors button i{width:10px;height:10px;border-radius:99px;display:inline-block}
.colors button.on{background:var(--raise3);color:var(--txt);border-color:#42506a}
.row.sel{box-shadow:0 0 0 2px var(--study) inset,0 0 0 1px var(--study);background:var(--raise)}
html.selecting .row .chk{opacity:.35}
html.selecting .fab{transform:translateY(140px);opacity:0;pointer-events:none}
.fab{transition:transform .18s ease,opacity .18s ease}
.hist{display:flex;flex-direction:column;gap:5px;margin:2px 0 12px}
.hrow{display:flex;gap:8px;font-size:11.5px;color:var(--dim2)}
.hrow span{color:var(--dim);flex:0 0 44px}
.wkbig .b{padding:12px 12px 14px;border-radius:13px}
.wkbig .b strong{font-size:26px;line-height:1.2}
.wkbig .b em{font-size:11px}
.wkspark{display:flex;align-items:flex-end;gap:7px;height:52px;padding:0 3px;margin-top:4px}
.wkspark i{flex:1;display:block;border-radius:5px 5px 3px 3px;background:var(--raise3);min-height:4px}
#selbar{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:31;
  display:flex;align-items:center;gap:7px;padding:9px 11px;border-radius:15px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 12px 30px -12px #000}
#selbar .ck{font-size:12px;color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#selbar button{font-family:inherit;font-size:12.5px;padding:7px 10px;border-radius:9px;
  border:1px solid var(--line2);background:var(--raise);color:var(--txt);flex:0 0 auto}
#selbar button.pri{background:var(--study);border-color:var(--study);color:#fff}
#selbar button.danger{color:var(--danger)}
.row.swiping{transition:none!important;background:var(--raise2);box-shadow:none;
  will-change:transform;z-index:3;position:relative}
.row{touch-action:pan-y}
.row.dragging{opacity:.92;transform:scale(1.015);box-shadow:0 10px 28px -10px #000,0 0 0 1px #4a8cff;
  touch-action:none;z-index:5}
.row.shift{transition:transform .15s}
.row:active{transform:scale(.985)}
.row.done{opacity:.45}
.chk{flex:0 0 auto;width:26px;height:26px;border-radius:9px;border:2px solid var(--line2);
  background:transparent;margin-top:1px;display:flex;align-items:center;justify-content:center;
  padding:0;transition:all .15s;color:transparent;font-size:15px}
.row.done .chk{background:var(--sport);border-color:var(--sport);color:#08120e}
.mid{flex:1;min-width:0}
.tt{font-size:16px;line-height:1.35;word-break:break-word}
.row.done .tt{text-decoration:line-through}
.meta{font-size:12px;color:var(--dim);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{width:7px;height:7px;border-radius:99px;display:inline-block}
.od{color:var(--danger);font-weight:600}
.more{flex:0 0 auto;width:32px;height:32px;border:none;background:transparent;color:var(--dim2);font-size:18px;line-height:1;padding:0}
.empty{color:var(--dim2);font-size:14px;text-align:center;padding:34px 10px;line-height:1.8}
.tpl{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.tpl-h{font-size:11.5px;color:var(--dim2);margin-bottom:9px;text-align:center}
.plist{max-height:46vh;overflow-y:auto;margin-top:12px;display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:9px;background:var(--raise2);border:1px solid var(--line);
  border-radius:10px;padding:9px 10px;font-size:13px}
.prow input{width:17px;height:17px;flex:0 0 auto;accent-color:#4a8cff}
.prow .pt{flex:1;min-width:0;word-break:break-word}
.prow .pv{font-size:10.5px;color:var(--dim2);flex:0 0 auto}
.ringrow{display:flex;align-items:center;gap:7px;margin-bottom:12px}
.ringrow span{flex:1;min-width:0;font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{border:1px solid var(--line);background:var(--raise);color:var(--dim);font-family:inherit;
  font-size:11px;padding:3px 9px;border-radius:99px;line-height:1.5}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:11px}
.lcard.done{opacity:.5}
.lcard .lt{font-size:16px;font-weight:600;display:flex;gap:9px;align-items:flex-start}
.lnote{font-size:13.5px;color:var(--dim);margin:8px 0 0;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cd{display:inline-block;margin-top:11px;font-size:12.5px;color:#c3b3ff;background:#241f38;
  border:1px solid #37305a;border-radius:99px;padding:5px 11px}
.cd.soon{color:#ffd08a;background:#2e2317;border-color:#4a3823}
.cd.over{color:#ffb3b3;background:#301b1b;border-color:#4d2626}
.drawer-mask{position:fixed;inset:0;z-index:60;background:#000a;opacity:0;pointer-events:none;transition:opacity .22s}
.drawer-mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;z-index:61;width:78%;max-width:320px;
  background:var(--sheetbg);box-shadow:12px 0 34px -18px #000;
  transform:translateX(-102%);transition:transform .26s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}
.drawer.on{transform:translateX(0)}
.dr-head{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.dr-head b{font-size:16.5px}
.dr-head span{font-size:11px;color:var(--dim2);flex:1}
.dr-x{width:30px;height:30px;border-radius:9px;border:none;background:var(--raise3);color:var(--dim);
  font-size:14px;padding:0;font-family:inherit}
.dr-sec{margin-bottom:15px}
.dr-sec>h4{margin:0 0 7px 2px;font-size:11.5px;color:var(--dim2);font-weight:500;letter-spacing:.4px}
.dr-row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font-family:inherit;
  background:var(--raise2);border:1px solid var(--line);border-radius:11px;
  padding:10px 11px;margin-bottom:6px;color:var(--txt);font-size:13.5px}
.dr-row:active{background:var(--raise3)}
.dr-row .k{flex:1;min-width:0}
.dr-row .v{font-size:11.5px;color:var(--dim2);flex:0 0 auto}
.dr-row .ok{font-size:11.5px;color:var(--sport);flex:0 0 auto}
.dr-row .no{font-size:11.5px;color:var(--danger);flex:0 0 auto}
.dr-big{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.dr-big div{background:var(--raise2);border:1px solid var(--line);border-radius:11px;padding:9px 5px;text-align:center}
.dr-big b{display:block;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.25}
.dr-big em{font-style:normal;font-size:10.5px;color:var(--dim2)}
.dr-theme{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.dr-theme button{border:1px solid var(--line);background:var(--raise2);color:var(--dim);
  border-radius:10px;padding:9px 4px;font-size:12.5px;font-family:inherit}
.dr-theme button.on{background:var(--selbg);border-color:var(--selbd);color:var(--seltxt)}
.dr-foot{font-size:10.5px;color:var(--dim2);line-height:1.7;margin-top:auto;padding-top:10px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  background:var(--navbg);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{flex:1;background:none;border:none;color:var(--dim2);font-size:12px;padding:8px 2px 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit}
nav button .ic{width:22px;height:22px;border-radius:7px;background:var(--raise);transition:all .18s}
nav button.on{color:var(--txt)}
nav button.on .ic{background:var(--ac,#4a8cff);box-shadow:0 0 14px -2px var(--ac,#4a8cff)}
nav button[data-tab="today"]{--ac:#4a8cff}
nav button[data-tab="study"]{--ac:var(--study)}
nav button[data-tab="life"]{--ac:var(--life)}
nav button[data-tab="sport"]{--ac:var(--sport)}
nav button[data-tab="long"]{--ac:var(--long)}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:31;
  width:56px;height:56px;border-radius:50%;border:none;background:#4a8cff;color:#fff;font-size:30px;
  line-height:1;box-shadow:0 8px 24px -6px #4a8cff99}
.fab:active{transform:scale(.94)}
.sheet-mask{position:fixed;inset:0;z-index:40;background:#000a;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--sheetbg);border-radius:20px 20px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(102%);
  transition:transform .26s cubic-bezier(.22,1,.36,1);max-height:90vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheet h3{margin:0 0 14px;font-size:17px}
label.f{display:block;font-size:12.5px;color:var(--dim);margin:14px 0 6px}
input[type=text],input[type=date],input[type=time],textarea,select{
  width:100%;background:var(--raise2);border:1px solid var(--line);border-radius:11px;color:var(--txt);
  padding:12px;font-size:16px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--selbd)}
textarea{resize:vertical;min-height:64px;line-height:1.55}
.dtrow{display:flex;gap:9px}
.dtrow input[type=date]{flex:1.35}
.twrap{position:relative;flex:1}
.twrap input[type=time]{width:100%;color:transparent}
.twrap.filled input[type=time]{color:var(--txt)}
.twrap .ph{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;
  color:var(--dim2);pointer-events:none;white-space:nowrap}
.twrap.filled .ph{display:none}
.quick{display:flex;gap:7px;margin-top:9px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:0 0 auto;background:var(--raise2);border:1px solid var(--line);color:var(--dim);
  border-radius:8px;padding:7px 11px;font-size:12.5px;font-family:inherit}
.quick button:active{background:#212835;color:var(--txt)}
.quick button.on{background:var(--selbg);color:var(--seltxt);border-color:var(--selbd)}
.quick.early{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;overflow:visible}
.quick.early>button{font-size:12px;padding:9px 2px;text-align:center}
.cats{display:flex;gap:8px}
.cats button{flex:1;padding:11px 4px;border-radius:11px;border:1px solid var(--line);background:var(--raise2);
  color:var(--dim);font-size:14px;font-family:inherit;transition:all .15s}
.cats button.on{color:#08101c;font-weight:600;border-color:transparent}
.cats button[data-cat="study"].on{background:var(--study)}
.cats button[data-cat="life"].on{background:var(--life)}
.cats button[data-cat="sport"].on{background:var(--sport)}
.cats button[data-cat="long"].on{background:var(--long)}
.btns{display:flex;gap:10px;margin-top:20px}
.btns button{flex:1;padding:14px;border-radius:13px;border:none;font-size:15.5px;font-family:inherit;font-weight:600}
.b-main{background:#4a8cff;color:#fff}
.b-ghost{background:var(--raise3);color:var(--txt)}
.b-del{background:#3a1e22;color:#ff8a8a;flex:0 0 84px}
.hint{font-size:12px;color:var(--dim2);line-height:1.7;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:var(--toastbg);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:99px;opacity:0;
  transition:all .25s;z-index:60;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 18px;
  border-radius:16px;text-align:left}
.toast.act button{border:none;background:#4a8cff;color:#fff;font-size:13px;font-family:inherit;
  padding:8px 14px;border-radius:99px;white-space:nowrap}
.toast.act button:active{opacity:.8}
@keyframes chkpop{0%{transform:scale(.75)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes rowin{0%{opacity:.35;transform:translateY(-4px)}100%{opacity:.45;transform:none}}
.row.just-checked .chk{animation:chkpop .34s cubic-bezier(.34,1.56,.64,1)}
.row.just-checked{animation:rowin .34s ease-out}
@keyframes barflash{0%{filter:brightness(1.85) saturate(1.3)}100%{filter:none}}
.bar>i.bump{animation:barflash .55s ease-out}
dialog{border:none;background:var(--sheetbg);color:var(--txt);border-radius:18px;padding:20px;width:88vw;max-width:420px}
dialog::backdrop{background:#000a}

/* ---------- 拖动把手 / 悬浮层 ---------- */
.grip{flex:0 0 auto;align-self:center;width:12px;color:var(--dim2);font-size:12px;line-height:1;
  letter-spacing:-1px;pointer-events:none;user-select:none;-webkit-user-select:none;text-align:center}
.row.ghost-on{opacity:.22;filter:grayscale(.5)}
.row.ghost-on .grip{color:transparent}
.drag-ghost{position:fixed;z-index:70;margin:0!important;pointer-events:none;
  background:var(--raise3);border-color:#4a8cff;box-shadow:0 18px 40px -10px #000,0 0 0 1px #4a8cff99;
  opacity:.98;will-change:transform;transform-origin:50% 50%}
.drag-ghost .grip{color:#7fb0ff}

/* ---------- 统计面板 ---------- */

.panel-mask.on{opacity:1;pointer-events:auto}
.panel{position:fixed;inset:0;z-index:51;background:var(--bg);transform:translateY(102%);
  transition:transform .3s cubic-bezier(.22,1,.36,1);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
.panel.on{transform:translateY(0)}
.p-head{display:flex;align-items:center;gap:10px}
.p-head h2{margin:0;font-size:19px;flex:1}
.p-x{border:none;background:var(--raise3);color:var(--dim);width:34px;height:34px;border-radius:10px;font-size:15px;font-family:inherit}
.ybar{display:flex;align-items:center;justify-content:center;gap:16px;margin:12px 0 16px}
.ybar button{border:1px solid var(--line);background:var(--card);color:var(--dim);width:40px;height:34px;
  border-radius:10px;font-size:15px;font-family:inherit}
.ybar button:disabled{opacity:.28}
.ybar button:not(:disabled){color:var(--txt);background:var(--raise3);border-color:var(--selbd)}
.ybar b{font-size:19px;letter-spacing:.5px;font-variant-numeric:tabular-nums;min-width:88px;text-align:center}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big .b{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.big .b em{display:block;font-size:11.5px;color:var(--dim);font-style:normal;margin-bottom:7px}
.big .b strong{font-size:25px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.big .b i{font-size:11.5px;color:var(--dim2);font-style:normal;margin-left:3px}
.sbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.sbox h4{margin:0 0 12px;font-size:12.5px;color:var(--dim);font-weight:500;display:flex;gap:6px;align-items:center}
.cbar{display:flex;height:11px;border-radius:99px;overflow:hidden;background:var(--raise2);margin-bottom:12px}

.clist div{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--dim)}
.clist div .k{flex:1}
.clist div b{color:var(--txt);font-variant-numeric:tabular-nums}
.clist div span:last-child{white-space:nowrap}
.tpsep{font-size:11.5px;color:var(--dim2);margin:12px 0 7px 2px}
.tpmine{display:flex;align-items:stretch;gap:6px}
.tpmine .gitem{flex:1}
.tpmdel{flex:0 0 34px;border:1px solid var(--line);background:var(--raise2);color:var(--dim2);
  border-radius:12px;font-size:12px;font-family:inherit}
.cmpwrap{margin-top:4px}
.cmprow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-bottom:7px}
.cmprow span{width:30px;flex:0 0 auto}
.cmprow i{display:block;height:9px;border-radius:99px;background:linear-gradient(90deg,#4a8cff,#34d399);min-width:2px}
.cmprow.prev i{background:var(--line2);opacity:.7}
.cmprow b{font-size:12.5px;color:var(--txt);font-variant-numeric:tabular-nums;width:26px;text-align:right}
.heat{display:flex;flex-direction:column;gap:3.5px}
.hmon{display:flex;align-items:center;gap:6px}

.hc{height:13px;border-radius:3px;background:var(--heat0);display:block}
.hc.l1{background:#24406a}.hc.l2{background:#3a6fb5}.hc.l3{background:#5b93e0}.hc.l4{background:#9cc5f8}

.subs{margin-top:2px}

  border-radius:10px;padding:9px 10px;margin-bottom:6px;font-size:14px}
.sub .st{flex:1;min-width:0;word-break:break-word}
.sub.done .st{text-decoration:line-through;color:var(--dim2)}
.sub .sdel{border:none;background:transparent;color:var(--dim2);font-size:15px;padding:2px 4px;font-family:inherit}

  color:transparent;font-size:12px;padding:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sub.done .schk{background:var(--sport);border-color:var(--sport);color:#08120e}
.subbar{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim2)}
.subbar i{display:block;width:34px;height:4px;border-radius:99px;background:var(--track);overflow:hidden}
.subbar i b{display:block;height:100%;background:var(--sport)}
.subbar[data-subtoggle]{cursor:pointer;-webkit-user-select:none;user-select:none;padding:1px 2px}
.subrows{margin-top:9px;display:flex;flex-direction:column;gap:6px}

  border-radius:9px;padding:7px 10px}

  color:transparent;font-size:11px;padding:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto}

.sres .row .mid{cursor:pointer}
.ms{display:flex;flex-wrap:wrap;gap:7px}
.ms span{font-size:11.5px;padding:5px 10px;border-radius:99px;background:var(--raise3);color:var(--dim2)}
.ms span.on{background:#1c3a2b;color:#6ee7b7;border:1px solid #2d6249}
.glist{display:flex;flex-direction:column;gap:8px;margin-top:14px}

  border:1px solid var(--line);background:var(--raise2);border-radius:12px;padding:10px 12px;
  color:var(--txt);font-family:inherit;width:100%;position:relative}
.gitem:active{background:var(--raise3)}
.gitem:focus{outline:none}
.gtips{display:flex;flex-direction:column;gap:7px;margin:12px 0 14px;padding:11px 12px;
  background:var(--raise);border-radius:12px}
.gtip{font-size:12px;line-height:1.5;color:var(--dim)}
.gtip b{color:var(--txt);font-weight:600}

.gitem span{font-size:11.5px;color:var(--dim2);line-height:1.55;padding-right:46px}
.gitem i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;
  font-size:11.5px;color:var(--study)}

.gfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.gfoot .b-ghost{flex:0 0 auto;padding:11px 20px}

.dtop:last-child{border-bottom:none}

.dtop .n{color:var(--danger);font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
</style>

<body>

<header id="hd"></header>
<main id="view"></main>

<button class="fab" id="fab">＋</button>

<nav id="nav">
  <button data-tab="today" class="on"><i class="ic"></i>今天</button>
  <button data-tab="study"><i class="ic"></i>学习</button>
  <button data-tab="life"><i class="ic"></i>生活</button>
  <button data-tab="sport"><i class="ic"></i>运动</button>
  <button data-tab="long"><i class="ic"></i>长期</button>
</nav>
<div class="drawer-mask" id="dMask"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="sheet">
  <h3 id="sheetTitle">新建</h3>
  <label class="f">任务 / 想法</label>
  <input type="text" id="fTitle" placeholder="要做什么？可直接写「明天8点 跑步 30分钟」" autocomplete="off">
  <div class="hint" id="qPreview" style="margin-top:6px;display:none"></div>
  <label class="f">分类</label>
  <div class="cats" id="fCats">
    <button data-cat="study">学习</button>
    <button data-cat="life">生活</button>
    <button data-cat="sport">运动</button>
    <button data-cat="long">长期</button>
  </div>
  <label class="f">优先级颜色（默认按排序自动）</label>
  <div class="colors" id="fColor">
    <button data-color=""><i style="background:#6b7688"></i>自动</button>
    <button data-color="red"><i style="background:#ff4d4f"></i>红</button>
    <button data-color="amber"><i style="background:#f5a524"></i>黄</button>
    <button data-color="green"><i style="background:#34d399"></i>绿</button>
  </div>
  <label class="f" id="dueLabel">日期（可空）</label>
  <div class="dtrow">
    <input type="date" id="fDate">
    <div class="twrap"><input type="time" id="fTime" step="1"><span class="ph" id="phTime">选时间</span></div>
  </div>
  <label class="f">提醒（可选，留空则不提醒）</label>
  <div class="dtrow">
    <input type="date" id="fRDate">
    <div class="twrap"><input type="time" id="fRTime" step="1"><span class="ph" id="phRTime">选时间</span></div>
  </div>
  <div class="quick">
    <button data-q="now">1 分钟后</button>
    <button data-q="08:00">08:00</button>
    <button data-q="12:30">12:30</button>
    <button data-q="20:00">20:00</button>
    <button data-q="now2">现在+2秒</button>
  </div>
  <label class="f">提前提醒（可选）</label>
  <div class="quick early" id="fEarly">
    <button data-early="0" class="on">到点</button>
    <button data-early="1">1 分</button>
    <button data-early="5">5 分</button>
    <button data-early="10">10 分</button>
    <button data-early="30">30 分</button>
  </div>
  <label class="f">提醒方式</label>
  <div class="quick early" id="fMode" style="grid-template-columns:repeat(3,1fr)">
    <button data-mode="alarm" class="on">闹钟</button>
    <button data-mode="silent">静音弹窗</button>
    <button data-mode="vibrate">震动弹窗</button>
  </div>
  <div id="fRingWrap">
  <label class="f">铃声</label>
  <div class="ringrow">
    <span id="fRingName">系统默认</span>
    <button type="button" class="b-ghost" id="bPickRing" style="flex:0 0 auto;padding:7px 12px;font-size:12.5px">选择</button>
    <button type="button" class="b-ghost" id="bTryRing" style="flex:0 0 auto;padding:7px 12px;font-size:12.5px">试听</button>
    <button type="button" class="b-ghost" id="bDefRing" style="flex:0 0 auto;padding:7px 12px;font-size:12.5px">默认</button>
  </div>
  </div>
  <label class="f">重复</label>
  <div class="quick" id="fRepeat">
    <button data-rep="" class="on">不重复</button>
    <button data-rep="daily">每天</button>
    <button data-rep="weekly">每周</button>
    <button data-rep="monthly">每月</button>
  </div>
  <div id="fDowWrap" style="display:none">
    <label class="f">重复的星期（可多选）</label>
    <div class="quick" id="fDow">
      <button data-dow="1">一</button><button data-dow="2">二</button><button data-dow="3">三</button>
      <button data-dow="4">四</button><button data-dow="5">五</button><button data-dow="6">六</button>
      <button data-dow="0">日</button>
    </div>
  </div>
  <div id="fDomWrap" style="display:none">
    <label class="f">每月几号</label>
    <select id="fDom"></select>
  </div>
  <label class="f">子任务（可选，可逐条勾掉）</label>
  <div class="subs" id="fSubs"></div>
  <div class="dtrow" style="margin-top:8px">
    <input type="text" id="fSubIn" placeholder="加一条子任务，回车也可以" autocomplete="off">
    <button class="b-ghost" id="bAddSub" style="flex:0 0 72px;padding:0;border-radius:11px;font-size:14px">添加</button>
  </div>
  <label class="f">备注</label>
  <textarea id="fNote" placeholder="补充说明，可空"></textarea>
  <div id="fHist" style="display:none"></div>
  <div class="btns">
    <button class="b-main" id="bSave">保存</button>
    <button class="b-del" id="bDel">删除</button>
  </div>
  <div class="hint">任务只存在这台手机上。建议定期在上面「⋯ 数据」里导出备份。</div>
</div>

<div class="toast" id="toast"></div>

<div class="panel-mask" id="stMask"></div>
<aside class="panel" id="stPanel"></aside>

<script>
(function(){
'use strict';
var CATS={study:{n:'学习',c:'#4a8cff'},life:{n:'生活',c:'#ff9f43'},sport:{n:'运动',c:'#34d399'},long:{n:'长期',c:'#a78bfa'}};
var KEY='ll_tasks_v1', tab='today', filter='today', editing=null, draftCat='study';
var tasks=[], storeOk=true;
var NATIVE=(typeof AndroidHost!=='undefined')?AndroidHost:null;
var APP_VER='2.4.1';
var selDate=today(), rangeA=null, rangeB=null, draftColor='', draftEarly=0, draftSound='', ringNames={}, globalDefaultName='';
var draftRepeat='', draftDow=[], draftDom=0, draftSubs=[], draftMode='alarm';

function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function fromYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=fromYmd(s);d.setDate(d.getDate()+n);return ymd(d)}
function hmToMs(hm){if(!hm)return 0;var p=hm.split(':');
  return ((+p[0])*60+(+(p[1]||0)))*60000+(+(p[2]||0))*1000}
function fmtT(tm){if(!tm)return '';var p=tm.split(':');
  return p[0]+':'+(p[1]||'00')+((p[2]&&p[2]!=='00')?':'+p[2]:'')}
function tsOf(dateStr,timeStr){if(!dateStr)return null;return fromYmd(dateStr).getTime()+hmToMs(timeStr)}
function syncNative(){
  if(!NATIVE)return;
  var list=[];
  tasks.forEach(function(t){
    if(t.done||!t.remindDate||!t.remindTime)return;
    var at=tsOf(t.remindDate,t.remindTime);
    if(!at)return;
    at-= (t.early||0)*60000;                       /* 提前提醒 */
    if(at<Date.now())at=Date.now()+1000;
    list.push({id:t.id,sound:(t.sound||globalSound()||''),
      title:(CATS[t.cat]||CATS.study).n+' · '+t.title,
      body:((t.deferred>=3?'已经顺延 '+t.deferred+' 次了，要不要拆小一点？ · ':'')+
        (t.early?'提前 '+(t.early)+' 分钟 · ':'')+
        (t.note||(dayLabel(t.remindDate)+' '+fmtT(t.remindTime)))),
      mode:(t.mode||'alarm'),at:at});
  });
  try{NATIVE.sync(JSON.stringify(list))}catch(e){}
}
/* 原生那边攒下的操作（通知栏点「完成」/「稍后」、收尾通知点「全部顺延」） */
function drainNative(){
  if(!NATIVE)return;
  var changed=false, didDone=0, didDefer=false;
  try{
    if(NATIVE.takeLaunchAct){
      var act=NATIVE.takeLaunchAct();
      if(act==='new'){openSheet(null)}
      else if(act==='stats'){openStats()}
    }
  }catch(e){}
  try{
    if(NATIVE.takeOps){
      var ops=JSON.parse(NATIVE.takeOps()||'[]');
      (ops||[]).forEach(function(o){
        if(!o)return;
        if(o.t==='done'){
          var t=tasks.filter(function(x){return x.id===o.id})[0];
          if(t&&!t.done){t.done=true;t.doneDate=today();t.notified=true;changed=true;didDone++}
        }else if(o.t==='deferall'){
          var t0=today(), nd=addDays(t0,1);
          tasks.forEach(function(x){
            if(x.cat==='long'||x.done||!x.dueDate)return;
            if(x.dueDate>t0)return;
            pushHist(x,'顺延',x.dueDate,nd);
            x.deferred=(x.deferred||0)+1;
            x.origDue=x.origDue||x.dueDate;
            x.dueDate=nd;
            changed=true;didDefer=true;
          });
        }
      });
      if(changed){save();render()}
      if(didDefer)toast('今天剩下的已顺延到明天');
      else if(didDone)toast('已完成 '+didDone+' 条');
    }
  }catch(e){}
}

/* 22:00 收尾：把今天的进度交给原生去发通知 */
function wrapupOn(){try{return localStorage.getItem('ll_wrapup')!=='0'}catch(e){return true}}
function wrapupText(){
  var t=today();
  var list=tasks.filter(function(x){return x.cat!=='long'&&x.dueDate===t});
  var done=list.filter(function(x){return x.done}).length;
  var open=list.length-done;
  if(!list.length)return '今天没有安排，早点休息';
  if(!open)return '今天 '+done+'/'+list.length+' 全部做完了，收工';
  return '今天 '+done+'/'+list.length+' 完成，还有 '+open+' 件没收尾';
}
function syncWrapup(){
  if(!NATIVE||!NATIVE.setWrapup)return;
  try{NATIVE.setWrapup(wrapupOn()?1:0,wrapupText())}catch(e){}
}

/* 零点顺延：过去未完成的任务自动挪到今天 */
function rollover(silent){
  var t=today(), moved=0;
  tasks.forEach(function(x){
    if(x.cat==='long'||x.done||!x.dueDate)return;
    if(x.dueDate<t){
      if(!x.origDue&&x.dueDate!==t)x.origDue=x.dueDate;
      x.dueDate=t;
      x.deferred=(x.deferred||0)+1;
      x.order=Date.now()-500000+moved;   // 顺延上来的排在前面
      moved++;
    }
  });
  if(moved){save();if(!silent)toast(moved+' 项未完成已顺延到今天')}
  return moved;
}
var lastDay=today();
function dayTick(){
  var t=today();
  if(t!==lastDay){lastDay=t;rollover(true);render()}
}
function load(){try{var r=localStorage.getItem(KEY);tasks=r?JSON.parse(r)||[]:[]}catch(e){tasks=[];storeOk=false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){storeOk=false}syncNative();syncWrapup();maybeBackup()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---------- 舞台：#stage 包住所有内容，单手模式只缩放它 ---------- */
function stageEl(){return document.getElementById('stage')||document.body}
(function buildStage(){
  if(document.getElementById('stage'))return;
  var st=document.createElement('div');
  st.id='stage';
  while(document.body.firstChild)st.appendChild(document.body.firstChild);
  document.body.appendChild(st);
})();

/* ---------- 外观 / 主题 ---------- */
function themeMode(){try{return localStorage.getItem('ll_theme')||'auto'}catch(e){return 'auto'}}
function applyTheme(){
  var m=themeMode(), light=false;
  if(m==='light')light=true;
  else if(m==='auto'){
    try{light=!!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)}catch(e){}
  }
  document.documentElement.classList.toggle('light',light);

function dayLabel(ds){
  var t=today();
  if(ds===t)return '今天';
  if(ds===addDays(t,1))return '明天';
  if(ds===addDays(t,-1))return '昨天';
  var d=fromYmd(ds);
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function overDays(ds){
  var a=fromYmd(today()).getTime(), b=fromYmd(ds).getTime();
  return Math.max(1,Math.round((a-b)/86400000));
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function ensureRange(){
  if(!rangeA||selDate<rangeA||selDate>rangeB){
    rangeA=addDays(selDate,-90);

}
function md(ds){var p=ds.split('-');return (+p[1])+'/'+(+p[2])}
function wdOf(ds){return ['周日','周一','周二','周三','周四','周五','周六'][fromYmd(ds).getDay()]}
function dayTitle(ds){
  var t=today();
  if(ds===t)return '今天';
  if(ds===addDays(t,1))return '明天';
  if(ds===addDays(t,2))return '后天';
  if(ds===addDays(t,-1))return '昨天';
  var d=fromYmd(ds);
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function countMap(){
  var m={};

var PIN={'red':'#ff4d4f','amber':'#f5a524','green':'#34d399'};
function prioDot(t,rank,total){
  var c=t.color||'';
  var r=1;
  if(!c){
    var ratio=(total&&total>1)?(rank/(total-1)):0;
    c = ratio<0.34?'red' : ratio<0.7?'amber' : 'green';
    r = Math.max(0.5,1-ratio*0.5);
  }
  return '<i class="pdot" style="background:'+PIN[c]+';color:'+PIN[c]+';opacity:'+r.toFixed(2)+'"></i>';
}
function rowHtml(t,rank,total){
  var bar='';
  var c=CATS[t.cat]||CATS.study;
  var meta='<span class="dot" style="background:'+c.c+'"></span>'+c.n;
  if(t.dueDate){
    var lbl=dayLabel(t.dueDate)+(t.dueTime?' '+fmtT(t.dueTime):'');
    if(!t.done&&t.dueDate<today()) meta+='<span class="od">逾期'+overDays(t.dueDate)+'天 · '+lbl+'</span>';
    else meta+='<span>'+lbl+'</span>';
  }
  if(t.deferred) meta+='<span>顺延'+t.deferred+'次</span>';
  if(t.remindDate&&t.remindTime) meta+='<span>⏰'+(t.remindDate===today()?'':(t.remindDate.slice(5))+' ')+fmtT(t.remindTime)+
    (t.early?' <span style="color:#7fb0ff">提前'+t.early+'分</span>':'')+
    (t.mode==='silent'?' <span style="color:#8b94a7">静音</span>':t.mode==='vibrate'?' <span style="color:#8b94a7">震动</span>':'')+'</span>';
  if(t.repeat) meta+='<span style="color:#7fb0ff">🔁'+repLabel(t.repeat)+'</span>';
  var subBlock='';
  if(t.subs&&t.subs.length){
    var sd=t.subs.filter(function(x){return x.done}).length;
    var sOpen=(t.subsOpen!==false);
    meta+='<span class="subbar" data-subtoggle="'+t.id+'">'+sd+'/'+t.subs.length+
      '<i><b style="width:'+Math.round(sd/t.subs.length*100)+'%"></b></i>'+(sOpen?'▾':'▸')+'</span>';
    if(sOpen){

      }).join('')+'</div>';

  return '<div class="row'+(t.done?' done':'')+(subBlock?' has-subs':'')+'" data-id="'+t.id+'">'+
    '<button class="chk" data-chk="'+t.id+'">✓</button>'+

    (t.done?'':'<span class="grip">⋮⋮</span>')+
    '<button class="more" data-edit="'+t.id+'">⋯</button></div>';
}

function ordOf(t){return (t.order!=null?t.order:(t.createdAt||0))}
function byOrder(a,b){
  var x=ordOf(a), y=ordOf(b);
  if(x!==y)return x<y?-1:1;
  return byDue(a,b);
}
function byDue(a,b){
  var x=a.dueDate||'9999', y=b.dueDate||'9999';
  if(x!==y)return x<y?-1:1;
  return (a.dueTime||'99:99')<(b.dueTime||'99:99')?-1:1;
}

function renderToday(){
  var t=today(), s=selDate;
  var planned=tasks.filter(function(x){return x.cat!=='long'&&x.dueDate===s});
  var open=planned.filter(function(x){return !x.done}).sort(byOrder);
  var closed=planned.filter(function(x){return x.done});
  var doneOnDay=tasks.filter(function(x){return x.cat!=='long'&&x.done&&x.doneDate===s&&x.dueDate!==s});
  var undated=tasks.filter(function(x){return x.cat!=='long'&&!x.done&&!x.dueDate});
  var h='';
  /* 逾期：夜里顺延过来的，和本来就过了日期的，单独一块，别混在当天安排里 */
  /* 只有看「今天」时，顺延过来的才算「逾期」；看别的日期它们就是普通安排 */
  var over=(s===t)?open.filter(function(x){return x.deferred>0||(x.origDue&&x.origDue<s)}):[];
  var fresh=open.filter(function(x){return over.indexOf(x)<0});
  if(over.length){
    h+='<div class="sec" data-sec="over"><div class="sec-h"><b class="od">逾期</b><span class="cnt">'+over.length+'</span>'+
       '<button class="mini" data-act="clearover" style="margin-left:auto">转入今天</button></div>';
    h+=over.map(function(x,i){return rowHtml(x,i,over.length)}).join('');
    h+='</div>';
  }
  if(fresh.length){
    var isPast=s<t;
    h+='<div class="sec" data-sec="open"><div class="sec-h"><b'+(isPast?' class="od"':'')+'>'+(isPast?'当天未完成':'当天安排')+'</b><span class="cnt">'+fresh.length+'</span>'+
       (selecting?'':'<button class="mini" data-act="batch" style="margin-left:auto">☑️ 批量</button>')+'</div>';
    h+=fresh.map(function(x,i){return rowHtml(x,i,fresh.length)}).join('');
    h+='</div>';
  }else{
    h+='<div class="sec" data-sec="open"><div class="sec-h"><b>'+(s<t?'当天记录':'当天安排')+'</b><span class="cnt">0</span></div>'+
       '<div class="empty">'+(s===t?'今天还没有安排<br>点右下角 ＋ 加一条'
         :(s<t?'这一天没有记录':'这一天还没有安排<br>点 ＋ 给它加一条'))+'</div>'+
       (tasks.length? '':tplHtml())+'</div>';
  }
  var allDone=closed.concat(doneOnDay).sort(byDue);
  if(allDone.length){
    h+='<div class="sec" data-sec="done"><div class="sec-h"><b>'+(s===t?'今天完成':'当天完成')+'</b><span class="cnt">'+allDone.length+'</span></div>'+
       allDone.map(function(x){return rowHtml(x)}).join('')+'</div>';
  }
  if(s===t&&undated.length){
    h+='<div class="sec" data-sec="undated"><div class="sec-h"><b>未定期</b><span class="cnt">'+undated.length+'</span></div>'+
       undated.sort(byOrder).map(function(x){return rowHtml(x,null)}).join('')+'</div>';
  }
  return h;
}

/* ---------- 局部刷新：只动一行，不重建整页 ---------- */
function secOf(name){return document.querySelector('#view .sec[data-sec="'+name+'"]')}
function secCnt(el){var c=el&&el.querySelector('.sec-h .cnt');return c}
function bumpCnt(el,d){
  var c=secCnt(el);
  if(c)c.textContent=Math.max(0,(+c.textContent||0)+d);
}
/* 把行按 order 插进目标分区（放在第一个"比它大"的行前面） */
function insertByOrder(sec,row){
  var id=row.dataset.id;
  var t=tasks.find(function(x){return x.id===id});
  var rows=[].slice.call(sec.children).filter(function(n){return n.classList&&n.classList.contains('row')});
  var ref=null;
  for(var i=0;i<rows.length;i++){
    var o=tasks.find(function(x){return x.id===rows[i].dataset.id});
    if(o&&t&&ordOf(o)>ordOf(t)){ref=rows[i];break}
  }
  sec.insertBefore(row,ref||null);
}
/* 勾选/取消勾选时尽量只更新这一行，返回 false 表示需要整页重绘 */
function fastToggle(id){
  if(tab!=='today')return false;
  var t=tasks.find(function(x){return x.id===id});
  if(!t)return false;
  var row=document.querySelector('#view .row[data-id="'+id+'"]');
  if(!row)return false;
  var openSec=secOf('open'), doneSec=secOf('done');
  if(t.done){
    if(!doneSec){                       /* 还没有"完成"分区，建一个 */
      doneSec=document.createElement('div');
      doneSec.className='sec';
      doneSec.setAttribute('data-sec','done');
      doneSec.innerHTML='<div class="sec-h"><b>'+(selDate===today()?'今天完成':'当天完成')+'</b><span class="cnt">0</span></div>';
      document.getElementById('view').appendChild(doneSec);
    }
    var from=row.parentNode;
    row.classList.add('done');
    doneSec.insertBefore(row,null);
    if(from&&from!==doneSec)bumpCnt(from,-1);
    bumpCnt(doneSec,1);
    row.classList.remove('just-checked');void row.offsetWidth;row.classList.add('just-checked');
  }else{
    var from2=row.parentNode;
    row.classList.remove('done','just-checked');
    if(!openSec)return false;
    insertByOrder(openSec,row);
    if(from2&&from2!==openSec&&from2.getAttribute('data-sec')==='done')bumpCnt(from2,-1);
    bumpCnt(openSec,1);
  }
  renderHeader();
  var bar=document.querySelector('.bar>i');
  if(bar){bar.classList.remove('bump');void bar.offsetWidth;bar.classList.add('bump')}
  updateProgress();
  return true;
}

/* ---------- 重复任务 ---------- */
var DOW_CN=['日','一','二','三','四','五','六'];
function repLabel(r){
  if(!r)return '';
  if(r.type==='daily')return '每天';
  if(r.type==='weekly'){
    var d=(r.dow&&r.dow.length?r.dow.slice():[]).sort();
    return '每周'+d.map(function(x){return DOW_CN[x]}).join('');
  }
  if(r.type==='monthly')return '每月'+(r.dom||1)+'号';
  return '';
}
function nextRepeatDate(r,base){
  var b=fromYmd(base||today());
  if(r.type==='daily'){
    b.setDate(b.getDate()+1);return ymd(b);
  }
  if(r.type==='weekly'){
    var dows=(r.dow&&r.dow.length)?r.dow:[b.getDay()], i, d;
    for(i=1;i<=14;i++){
      d=new Date(b.getTime()+i*86400000);
      if(dows.indexOf(d.getDay())>=0)return ymd(d);
    }
    return ymd(new Date(b.getTime()+7*86400000));
  }
  if(r.type==='monthly'){
    var dom=r.dom||b.getDate();
    for(var k=1;k<=13;k++){
      var mm=b.getMonth()+1+k, yy=b.getFullYear();
      while(mm>12){mm-=12;yy++}
      var dim=new Date(yy,mm,0).getDate();
      var cand=yy+'-'+pad(mm)+'-'+pad(Math.min(dom,dim));
      if(cand>base)return cand;
    }
  }
  return addDays(base||today(),1);
}
function spawnRepeat(t){
  var base=t.dueDate||today();
  var nd=nextRepeatDate(t.repeat,base);
  var nt=JSON.parse(JSON.stringify(t));
  nt.id=uid();nt.createdAt=Date.now();nt.order=Date.now();
  nt.done=false;delete nt.doneDate;delete nt.spawned;delete nt.notified;
  nt.dueDate=nd;
  if(t.remindDate&&t.dueDate){
    var delta=Math.round((fromYmd(nd)-fromYmd(t.dueDate))/86400000);
    nt.remindDate=addDays(t.remindDate,delta);
  }else if(t.remindDate){
    nt.remindDate=nd;
  }
  if(nt.subs&&nt.subs.length){
    nt.subs=nt.subs.map(function(x){return {id:uid(),text:x.text,done:false}});
  }
  tasks.push(nt);
  t.spawned=nt.id;
  return nt;
}

/* ---------- 快速添加解析 ---------- */
var CN_N={'零':0,'一':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12};
function cnNum(x){if(/^\d+$/.test(x))return +x;return CN_N[x]==null?null:CN_N[x]}
function parseQuick(raw){
  var s=' '+(raw||'')+' ', out={date:'',time:'',cat:'',clean:'',pills:[]}, m;
  // 相对日
  m=/(大后天|大前天|今天|明天|后天|昨天|前天)/.exec(s);
  if(m){
    var off={'大后天':3,'后天':2,'明天':1,'今天':0,'昨天':-1,'前天':-2,'大前天':-3}[m[1]];
    out.date=addDays(today(),off);s=s.replace(m[0],' ');
  }else if((m=/(下)?(?:周|星期|礼拜)([一二三四五六日天])/.exec(s))){
    var map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};
    var tgt=(map[m[2]]+6)%7, cur=(fromYmd(today()).getDay()+6)%7;
    var delta=(tgt-cur+7)%7;if(delta===0)delta=7;
    if(m[1])delta+=7;
    out.date=addDays(today(),delta);s=s.replace(m[0],' ');
  }else if((m=/(\d{1,2}|[一二三四五六七八九十]{1,3})月(\d{1,2}|[一二三四五六七八九十]{1,3})(?:日|号)/.exec(s))){
    var mo=cnNum(m[1]),dd=cnNum(m[2]);
    if(mo&&dd){
      var y=+today().slice(0,4), cand=y+'-'+pad(mo)+'-'+pad(dd);
      if(cand<today())cand=(y+1)+'-'+pad(mo)+'-'+pad(dd);
      out.date=cand;s=s.replace(m[0],' ');
    }
  }
  // N 分钟后 / 小时后
  if((m=/(\d{1,3})\s*分钟(?:后|以后|之后)/.exec(s))){
    var t1=new Date(Date.now()+(+m[1])*60000);
    out.date=ymd(t1);out.time=pad(t1.getHours())+':'+pad(t1.getMinutes());s=s.replace(m[0],' ');
  }else if((m=/(\d{1,3})\s*小时(?:后|以后|之后)/.exec(s))){
    var t2=new Date(Date.now()+(+m[1])*3600000);
    out.date=ymd(t2);out.time=pad(t2.getHours())+':'+pad(t2.getMinutes());s=s.replace(m[0],' ');
  }else if((m=/(早上|上午|中午|下午|傍晚|晚上|凌晨)?\s*(\d{1,2})\s*(?:点|:|：)\s*(\d{1,2})?\s*(半)?/.exec(s))){
    var h=+m[2], mi=m[3]?(+m[3]):(m[4]?30:0), ap=m[1]||'';
    if((ap==='下午'||ap==='傍晚'||ap==='晚上')&&h<12)h+=12;
    if(ap==='中午'&&h<12&&h<11)h+=12;
    if(h>23)h=23;if(mi>59)mi=0;
    out.time=pad(h)+':'+pad(mi);s=s.replace(m[0],' ');
  }
  // 时长（30 分钟 / 1 小时）不算时间，只从标题去掉
  s=s.replace(/(\d{1,3})\s*(?:分钟|小时|分)(?![后以])/g,' ');
  // 分类关键词
  var KW=[['sport',/跑步|健身|运动|游泳|打球|骑车|锻炼|瑜伽|跳绳/],
          ['study',/读书|学习|背单词|复习|作业|看书|上课|笔记|刷题/],
          ['life',/买菜|购物|收拾|打扫|做饭|洗衣|快递|交费|缴费|理发/]];
  for(var i=0;i<KW.length;i++){if(KW[i][1].test(raw)){out.cat=KW[i][0];break}}
  out.clean=s.replace(/\s+/g,' ').trim();
  if(!out.clean)out.clean=(raw||'').trim();
  if(out.date)out.pills.push(dayTitle(out.date)==='今天'?'今天':(dayTitle(out.date)||out.date));
  if(out.time)out.pills.push(fmtT(out.time));
  if(out.cat)out.pills.push(CATS[out.cat].n);
  return out;
}
function cdText(t){
  if(!t.dueDate)return '未设时间';
  var ms=tsOf(t.dueDate,t.dueTime||'23:59')-Date.now();
  if(ms<=0)return '已到期';
  var d=Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000), m=Math.floor(ms%3600000/60000);
  if(d>0)return '还有 '+d+' 天 '+h+' 小时';
  if(h>0)return '还有 '+h+' 小时 '+m+' 分';
  return '还有 '+m+' 分钟';

var preciseT=null;
function schedulePrecise(){
  if(preciseT)clearTimeout(preciseT);
  var now=Date.now(), best=null;
  tasks.forEach(function(t){
    if(t.done||t.notified||!t.remindDate||!t.remindTime)return;
    var ms=tsOf(t.remindDate,t.remindTime);
    if(ms>now&&(best===null||ms<best))best=ms;
  });
  if(best===null)return;
  var d=Math.min(best-now,2147483000);
  preciseT=setTimeout(function(){checkReminders();schedulePrecise();},Math.max(0,d));
}
function checkReminders(){
  var now=Date.now(), changed=false;
  tasks.forEach(function(t){
    if(t.done||t.notified||!t.remindDate||!t.remindTime)return;
    var ms=tsOf(t.remindDate,t.remindTime)-(t.early||0)*60000;
    if(ms<=now&&now-ms<43200000){
      t.notified=true;changed=true;fireNotify(t);
    }
  });
  if(changed){save();render()}
}

function icesc(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function dtLocal(ds,hm){
  if(!ds)return null;

    pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';

function buildICS(list){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LifeLogbook//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  list.forEach(function(t){
    var ds=t.remindDate||t.dueDate, hm=t.remindTime||t.dueTime||'09:00';
    if(!ds)return;
    L.push('BEGIN:VEVENT');
    L.push('UID:'+t.id+'@lifelogbook');
    L.push('DTSTAMP:'+utcStamp());
    L.push('DTSTART;TZID=Asia/Shanghai:'+dtLocal(ds,hm));
    L.push('SUMMARY:'+icesc(t.title));
    L.push('DESCRIPTION:'+icesc((CATS[t.cat]||CATS.study).n+(t.note?(' / '+t.note):'')));

    L.push('DESCRIPTION:'+icesc(t.title));
    L.push('END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

/* GitHub 风：列 = 周（周一起），行 = 周一到周日 */
function heatWeekHtml(year,byDay,t0){
  var start=fromYmd(year+'-01-01');
  start.setDate(start.getDate()-((start.getDay()+6)%7));
  var end=fromYmd(year+'-12-31');

  var total=Math.round((end-start)/86400000)+1, weeks=Math.round(total/7);
  var cells='', i, d, ds;
  for(i=0;i<total;i++){
    d=new Date(start.getTime()+i*86400000); ds=ymd(d);
    var n=byDay[ds]||0, cls='hc';
    if(ds.slice(0,4)!==String(year))cls+=' pad';
    else if(ds>t0)cls+=' fut';
    else cls+=heatLevel(n);
    cells+='<i class="'+cls+'"'+(ds.slice(0,4)===String(year)?' data-sd="'+ds+'"':'')+'></i>';
  }
  var top='';
  for(var w=0;w<weeks;w++){
    var lab='';
    for(var m=1;m<=12;m++){
      var first=fromYmd(year+'-'+pad(m)+'-01');
      if(Math.floor((first-start)/86400000/7)===w)lab=(m===1?String(year).slice(2)+'年':m+'月');
    }
    top+='<span>'+(lab||'')+'</span>';
  }
  return '<div class="hwk-top" style="grid-template-columns:repeat('+weeks+',1fr)">'+top+'</div>'+
    '<div class="hweek" style="grid-template-columns:repeat('+weeks+',1fr)">'+cells+'</div>';
}
function statsHtml(year){
  var t0=today(), thisY=+t0.slice(0,4);

    return doneResolved(t)&&String(dateOfDone(t)).slice(0,4)===String(year);

  tasks.forEach(function(x){
    if(x.cat==='long'||!x.dueDate)return;

  });
  doneYear.forEach(function(t){

  });
  var days=Object.keys(byDay).sort(), total=doneYear.length;
  var longest=0,run=0,prev='';

    if(run>longest)longest=run;
    prev=ds;
  });
  var streak=0;
  if(year===thisY){
    var c=t0;
    if(!byDay[c])c=addDays(c,-1);
    while(byDay[c]){streak++;c=addDays(c,-1)}
  }
  var mKey=t0.slice(0,7), monthN=0;
  Object.keys(byDay).forEach(function(k){if(k.slice(0,7)===mKey)monthN+=byDay[k]});
  var avg=days.length?(total/days.length):0;

  var pctTotal=total||1;
  var catRow=['study','life','sport'].map(function(k){

  var heat = heatMode==='week' ? heatWeekHtml(year,byDay,t0) : heatMonthHtml(year,byDay,t0);

  /* ---- 月度对比 / 完成率 / 连续断点 ---- */
  var curD=new Date(), curKey=t0.slice(0,7);
  var pmD=new Date(curD.getFullYear(),curD.getMonth()-1,1);
  var prevKey=pmD.getFullYear()+'-'+pad(pmD.getMonth()+1)+'-01';
  prevKey=prevKey.slice(0,7);
  function doneIn(ym){
    return tasks.filter(function(x){return doneResolved(x)&&String(dateOfDone(x)).slice(0,7)===ym}).length;
  }
  var thisMonthN=doneIn(curKey), lastMonthN=doneIn(prevKey);
  function planIn(ym){
    var o={p:0,d:0};
    tasks.forEach(function(x){
      if(x.cat==='long'||!x.dueDate||x.dueDate.slice(0,7)!==ym)return;
      o.p++; if(x.done)o.d++;
    });
    return o;
  }
  var mNow=planIn(curKey), mPrev=planIn(prevKey);
  var rateNow=mNow.p?Math.round(mNow.d/mNow.p*100):0;
  var ratePrev=mPrev.p?Math.round(mPrev.d/mPrev.p*100):0;
  /* 全年平均完成率：每天完成数/当天计划数，只算有安排的日子 */
  var pSum=0,dSum=0,pDaysN=0,dayRates=[];
  Object.keys(plannedByDay).forEach(function(k){

  var yearRate=pSum?Math.round(dSum/pSum*100):0;
  var avgDayRate=dayRates.length?Math.round(dayRates.reduce(function(a,b){return a+b},0)/dayRates.length*100):0;
  /* 连续断点 */
  var lastActive=days.length?days[days.length-1]:'';
  var breakDays=0,lastRun=0;
  if(lastActive){
    breakDays=Math.round((fromYmd(t0)-fromYmd(lastActive))/86400000);
    var runN=0,pp='';
    days.forEach(function(ds){
      runN=(pp&&addDays(pp,1)===ds)?runN+1:1;
      pp=ds;
    });
    lastRun=runN;
  }
  var streakLine = (!lastActive) ? '还没有记录'
    : (breakDays<=1 ? '连续中 · '+streak+' 天'
       : '上次连续 '+lastRun+' 天，已断 '+breakDays+' 天');
  var cmpW=Math.max(thisMonthN,lastMonthN,1);
  var cmpBar='<div class="cmpwrap">'+
    '<div class="cmprow"><span>本月</span><i style="width:'+Math.round(thisMonthN/cmpW*100)+'%"></i><b>'+thisMonthN+'</b></div>'+
    '<div class="cmprow prev"><span>上月</span><i style="width:'+Math.round(lastMonthN/cmpW*100)+'%"></i><b>'+lastMonthN+'</b></div>'+
    '</div>';

  var defs=tasks.filter(function(t){return !t.done&&t.deferred>0})
    .sort(function(a,b){return b.deferred-a.deferred}).slice(0,4);
  var defHtml=defs.length?defs.map(function(t){
    return '<div class="dtop"><span class="k">'+esc(t.title)+'</span><span class="n">顺延 '+t.deferred+' 次</span></div>';
  }).join(''):'<div class="dtop" style="color:var(--dim2);border:none">还没有被顺延的任务</div>';

  var wkCard = year===thisY ? weekReviewHtml() : '';
  var r=statYears();
  var empty= total? '' : '<div class="sbox" style="text-align:center;color:var(--dim2);font-size:13.5px;line-height:1.8">'+
    year+' 年还没有完成记录<br>完成任务后这里就会长出来</div>';

  return '<div class="p-head"><h2>统计</h2><button class="p-x" id="stClose">✕</button></div>'+
    '<div class="ybar">'+
      '<button data-y="'+(year-1)+'"'+(year<=r.min?' disabled':'')+'>‹</button>'+
      '<b>'+year+' 年</b>'+
      '<button data-y="'+(year+1)+'"'+(year>=r.max?' disabled':'')+'>›</button>'+
      '<button data-yr="1" style="margin-left:auto;font-size:11.5px;white-space:nowrap">🖼 长图</button>'+
    '</div>'+
    (total?
      '<div class="big">'+
        '<div class="b"><em>累计完成</em><strong>'+total+'<i>件</i></strong></div>'+
        '<div class="b"><em>活跃天数</em><strong>'+days.length+'<i>天</i></strong></div>'+
        '<div class="b"><em>最长连续</em><strong>'+longest+'<i>天</i></strong></div>'+
        '<div class="b"><em>'+(year===thisY?'当前连续':'平均每个活跃日')+'</em><strong>'+
          (year===thisY?streak:avg.toFixed(1))+'<i>'+(year===thisY?'天':'件')+'</i></strong></div>'+
      '</div>':'')+
    empty+
    wkCard+
    (total?
      '<div class="sbox"><h4>'+(year===thisY?'本月完成 ':'当年月均 ')+
        '<b style="color:var(--txt);font-size:14px">'+
        (year===thisY?monthN+' 件':(total/12).toFixed(1)+' 件')+'</b></h4>'+
        '<div class="cbar">'+catBar+'</div><div class="clist">'+catRow+'</div></div>'+
      '<div class="sbox"><h4>本月 vs 上月</h4>'+cmpBar+
        '<div class="clist" style="margin-top:12px">'+
          '<div><span class="k">本月完成率</span><b>'+rateNow+'%</b><span style="color:var(--dim2);width:64px;text-align:right">'+
            (mNow.d+'/'+mNow.p)+'</span></div>'+
          '<div><span class="k">上月完成率</span><b>'+ratePrev+'%</b><span style="color:var(--dim2);width:64px;text-align:right">'+
            (mPrev.d+'/'+mPrev.p)+'</span></div>'+
          '<div><span class="k">全年完成率</span><b>'+yearRate+'%</b><span style="color:var(--dim2);width:64px;text-align:right">'+
            dSum+'/'+pSum+'</span></div>'+
          '<div><span class="k">平均每天</span><b>'+avgDayRate+'%</b><span style="color:var(--dim2);width:64px;text-align:right">'+
            pDaysN+' 天</span></div>'+
          '<div><span class="k">连续记录</span><b style="font-size:12.5px">'+streakLine+'</b></div>'+
        '</div></div>'+
      '<div class="sbox"><h4>全年热力图　<span style="color:var(--dim2);font-weight:400">点一天可跳过去</span></h4>'+
        '<div class="quick" style="margin:0 0 12px">'+
          '<button data-hm="month"'+(heatMode==='month'?' class="on"':'')+'>按月</button>'+
          '<button data-hm="week"'+(heatMode==='week'?' class="on"':'')+'>按周 · GitHub 风</button>'+
        '</div>'+
        '<div class="heat">'+heat+'</div>'+
        '<div class="heat-note"><span>少</span><i class="hc l1"></i><i class="hc l2"></i><i class="hc l3"></i><i class="hc l4"></i><span>多</span></div></div>'+
      '<div class="sbox"><h4>连续记录</h4><div class="ms">'+ms+'</div></div>':'')+
    (defs.length?'<div class="sbox"><h4>最容易拖延</h4>'+defHtml+'</div>':'');
}
/* ---------- 周复盘卡 ---------- */
function weekStartOf(ds){
  var d=fromYmd(ds||today());
  var wd=(d.getDay()+6)%7;             /* 周一为一周起点 */
  d.setDate(d.getDate()-wd);
  return ymd(d);
}
function weekStats(offset){
  var start=addDays(weekStartOf(),(offset||0)*7), end=addDays(start,6);
  var planned=tasks.filter(function(x){return x.cat!=='long'&&x.dueDate&&x.dueDate>=start&&x.dueDate<=end});
  var doneList=tasks.filter(function(x){
    return x.cat!=='long'&&doneResolved(x)&&String(dateOfDone(x))>=start&&String(dateOfDone(x))<=end;
  });
  var byCat={study:0,life:0,sport:0}, byDay={};
  doneList.forEach(function(x){
    if(byCat[x.cat]!=null)byCat[x.cat]++;
    var ds=String(dateOfDone(x));
    byDay[ds]=(byDay[ds]||0)+1;
  });
  var bestDay='',bestN=0;
  Object.keys(byDay).forEach(function(k){if(byDay[k]>bestN){bestN=byDay[k];bestDay=k}});
  return {start:start,end:end,planned:planned.length,done:doneList.length,
          rate:planned.length?Math.round(doneList.length/planned.length*100):0,
          byCat:byCat,byDay:byDay,bestDay:bestDay,bestN:bestN};
}
function weekReviewHtml(){
  var a=weekStats(0), b=weekStats(-1);
  var diff=a.done-b.done;
  var top='',topN=0;
  ['study','life','sport'].forEach(function(k){if(a.byCat[k]>topN){topN=a.byCat[k];top=k}});
  var spark=[];
  for(var i=0;i<7;i++){
    var ds=addDays(a.start,i), n=a.byDay[ds]||0, h=Math.max(4,Math.round(n/Math.max(1,a.bestN)*46));
    spark.push('<i style="height:'+h+'px;'+(ds===today()?'background:var(--study)':'')+'"></i>');
  }
  return '<div class="sbox"><h4>本周复盘 <span style="font-weight:400;color:var(--dim2);font-size:11.5px">'+
      a.start.slice(5)+' – '+a.end.slice(5)+'</span></h4>'+
    '<div class="big wkbig" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">'+
      '<div class="b"><em>完成</em><strong>'+a.done+'<i>件</i></strong></div>'+
      '<div class="b"><em>完成率</em><strong>'+a.rate+'<i>%</i></strong></div>'+
      '<div class="b"><em>vs 上周</em><strong style="color:'+(diff>=0?'var(--sport)':'var(--danger)')+'">'+
        (diff>0?'+':'')+diff+'<i>件</i></strong></div>'+
    '</div>'+
    '<div class="wkspark">'+spark.join('')+'</div>'+
    '<div class="clist" style="margin-top:10px">'+
      '<div><span class="k">最投入</span><b>'+(topN?(CATS[top].n+' '+topN+' 件'):'还没记录')+'</b></div>'+
      '<div><span class="k">最佳一天</span><b>'+(a.bestN?dayLabel(a.bestDay)+' '+a.bestN+' 件':'还没记录')+'</b></div>'+
    '</div></div>';
}

function shareYearReport(year){
  try{
    var url=buildYearReport(year);
    if(NATIVE&&NATIVE.shareImage){
      try{NATIVE.shareImage(url,'今日待办-'+year+'年度报告.png');toast('已生成，选择要分享的应用');return}catch(e){}
    }
    var a=document.createElement('a');

    toast('已保存长图');
  }catch(e){
    toast('生成失败：'+e.message);
  }

function buildYearReport(year){
  var W=1080, H=1720, c=document.createElement('canvas');
  c.width=W;c.height=H;
  var g=c.getContext('2d');
  var bg=g.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#0b1020');bg.addColorStop(1,'#141a2e');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  /* 顶部光晕 */
  var gr=g.createRadialGradient(W*0.5,-120,40,W*0.5,-120,720);
  gr.addColorStop(0,'rgba(74,140,255,.42)');gr.addColorStop(1,'rgba(74,140,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,W,760);

  function txt(s,x,y,size,color,weight,align){
    g.font=(weight||'400')+' '+size+'px sans-serif';
    g.fillStyle=color||'#e2e8f4';
    g.textAlign=align||'left';
    g.textBaseline='alphabetic';
    g.fillText(s,x,y);
  }
  function rrect(x,y,w,h,r,fill){
    g.beginPath();
    g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
    g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
    g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);
    g.closePath();g.fillStyle=fill;g.fill();
  }
  var doneList=tasks.filter(function(t){return doneResolved(t)&&String(dateOfDone(t)).slice(0,4)===String(year)});
  var byCat={study:0,life:0,sport:0}, byMonth={}, byDay={};
  doneList.forEach(function(t){
    if(byCat[t.cat]!=null)byCat[t.cat]++;
    var ds=String(dateOfDone(t));
    byMonth[+ds.slice(5,7)]=(byMonth[+ds.slice(5,7)]||0)+1;
    byDay[ds]=(byDay[ds]||0)+1;
  });
  var days=Object.keys(byDay).sort(), total=doneList.length;
  var longest=0,run=0,prev='';
  days.forEach(function(ds){run=(prev&&addDays(prev,1)===ds)?run+1:1;if(run>longest)longest=run;prev=ds});
  var planned=tasks.filter(function(x){return x.cat!=='long'&&x.dueDate&&String(x.dueDate).slice(0,4)===String(year)});
  var rate=planned.length?Math.round(total/planned.length*100):0;
  var bestM=1,bestN=0;
  Object.keys(byMonth).forEach(function(m){if(byMonth[m]>bestN){bestN=byMonth[m];bestM=+m}});

  txt('今 日 待 办',72,140,30,'#8fa3c8','600');
  txt(String(year),72,300,132,'#ffffff','700');
  txt('年 度 报 告',72,364,34,'#9fb4d8','500');
  txt('共完成 '+total+' 件 · 活跃 '+days.length+' 天',72,424,30,'#c8d4ea');

  /* 四个大数 */
  var cards=[['完成',total+' 件'],['完成率',rate+' %'],['最长连续',longest+' 天'],['最佳月份',bestN?(bestM+' 月 '+bestN+' 件'):'—']];
  cards.forEach(function(kv,i){
    var x=72+(i%2)*474, y=490+Math.floor(i/2)*150;
    rrect(x,y,450,126,26,'rgba(255,255,255,.055)');
    txt(kv[0],x+26,y+44,24,'#8fa3c8');
    txt(kv[1],x+26,y+96,40,'#ffffff','700');
  });

  /* 分类 */
  txt('分类分布',72,830,30,'#c8d4ea','600');
  ['study','life','sport'].forEach(function(k,i){
    var n=byCat[k], pct=total?Math.round(n/total*100):0;
    var y=880+i*78;
    txt(CATS[k].n,72,y+26,26,'#e2e8f4');
    rrect(210,y+4,700,28,14,'rgba(255,255,255,.07)');
    if(pct)rrect(210,y+4,Math.max(10,700*pct/100),28,14,CATS[k].c);
    txt(pct+'%  '+n+' 件',930,y+26,24,'#9fb4d8',null,'right');
  });

  /* 12 个月柱状 */
  txt('每个月完成了多少',72,1180,30,'#c8d4ea','600');
  var mMax=1;for(var m=1;m<=12;m++)mMax=Math.max(mMax,byMonth[m]||0);
  for(var i2=0;i2<12;i2++){
    var v=byMonth[i2+1]||0, h2=Math.max(6,Math.round(v/mMax*170)), x2=72+i2*79;
    rrect(x2,1400-h2,54,h2,12,v?(i2+1===bestM?'#4a8cff':'#2f4a7a'):'rgba(255,255,255,.06)');
    txt(String(i2+1),x2+27,1436,20,'#7c8aa6',null,'center');
    if(v)txt(String(v),x2+27,1390-h2,20,'#c8d4ea',null,'center');
  }
  txt('月',72+12*79,1436,20,'#7c8aa6');

  /* 页脚 */
  g.fillStyle='rgba(255,255,255,.06)';g.fillRect(72,1520,936,2);
  txt('LifeLog · 今日待办',72,1572,24,'#7c8aa6');
  txt('生成于 '+today()+' '+fmtT(new Date().toTimeString().slice(0,8)),72,1612,22,'#5f6c85');
  txt('数据只存在这台手机上',1008,1572,22,'#5f6c85',null,'right');
  return c.toDataURL('image/png');
}

/* ---------- 搜索 ---------- */
var searchQ='', searchOnlyOpen=false, panelMode='stats';
function searchResults(q){
  q=(q||'').trim().toLowerCase();
  if(!q)return [];
  return tasks.filter(function(t){
    if(searchOnlyOpen&&t.done)return false;
    return String(t.title||'').toLowerCase().indexOf(q)>=0
        || String(t.note||'').toLowerCase().indexOf(q)>=0;
  }).sort(function(a,b){
    if(a.done!==b.done)return a.done?1:-1;
    var x=a.dueDate||'zzz', y=b.dueDate||'zzz';
    if(x!==y)return x<y?-1:1;
    return (a.createdAt||0)-(b.createdAt||0);
  }).slice(0,60);
}
function searchListHtml(q){
  var list=searchResults(q);
  if(!q.trim())return '<div class="hint" style="margin-top:16px">输入关键字，跨所有日期查找任务和备注。<br>点结果可直接跳到那一天。</div>';
  if(!list.length)return '<div class="hint" style="margin-top:16px">没找到和「'+esc(q)+'」有关的任务。</div>';
  return '<div class="hint" style="margin:10px 0 12px">'+
    (list.length>=60?'前 60 条 · ':'找到 '+list.length+' 条 · ')+'点文字跳到那天</div>'+
    '<div class="sres">'+list.map(function(t){
      var row=rowHtml(t,null,null);
      return row.replace('<div class="row','<div data-sd="'+esc(t.dueDate||'')+'" class="row');
    }).join('')+'</div>';
}
function searchHtml(q){

  document.getElementById('stPanel').classList.remove('on');
}
document.getElementById('stMask').addEventListener('click',closeStats);
document.getElementById('stPanel').addEventListener('click',function(e){
  var btn=e.target.closest?e.target.closest('button'):null;
  if(btn){
    if(btn.id==='stClose'){closeStats();return}
    if(btn.dataset.so!=null){
      searchOnlyOpen=btn.dataset.so==='1';
      [].forEach.call(document.querySelectorAll('#stPanel [data-so]'),function(x){
        x.classList.toggle('on',(x.dataset.so==='1')===searchOnlyOpen);
      });
      refreshSearch();
      return;
    }
    if(btn.dataset.rq!=null){
      var q=btn.dataset.rq;
      if(q==='__clear'){try{localStorage.removeItem('ll_recent_q')}catch(e){};openSearch();return}
      searchQ=q;
      var inp=document.getElementById('sQ');
      if(inp){inp.value=q;try{inp.focus()}catch(e){}}
      var rw=document.getElementById('sRecent');if(rw)rw.style.display='none';
      refreshSearch();
      return;
    }
    if(btn.dataset.hm){heatMode=btn.dataset.hm;saveHeatMode();openStats(statYear);return}
    if(btn.dataset.y!=null&&btn.dataset.y!==''){openStats(+btn.dataset.y);return}
    return;                                   /* 其他按钮交给全局 click */
  }
  var holder=e.target.closest?e.target.closest('[data-sd]'):null;
  if(holder&&holder.dataset.sd){closeStats();selectDate(holder.dataset.sd);}
});
document.getElementById('stPanel').addEventListener('input',function(e){
  if(e.target&&e.target.id==='sQ'){searchQ=e.target.value;refreshSearch()}
});
document.getElementById('stPanel').addEventListener('keydown',function(e){
  if(e.target&&e.target.id==='sQ'&&e.key==='Enter'){
    pushRecentQ(searchQ);
    var rw=document.getElementById('sRecent');
    if(rw)rw.style.display='none';
  }
});
/* 点搜索结果也记一条，省得每次重打 */
document.getElementById('stPanel').addEventListener('click',function(e){
  var h=e.target.closest?e.target.closest('[data-sd]'):null;
  if(h&&searchQ)pushRecentQ(searchQ);
},true);

/* 本周一 00:00 的日期串 */
function thisWeekStart(){
  var d=fromYmd(today());
  var wd=(d.getDay()+6)%7;
  return ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()-wd));
}
function drawerStats(){
  var ws=thisWeekStart(), t=today();
  var doneWeek=tasks.filter(function(x){return x.done&&x.doneDate&&x.doneDate>=ws}).length;
  var todayAll=tasks.filter(function(x){return x.cat!=='long'&&x.dueDate===t});
  var todayDone=todayAll.filter(function(x){return x.done}).length;
  var over=tasks.filter(function(x){return x.cat!=='long'&&!x.done&&((x.dueDate&&x.dueDate<t)||(x.deferred>0))}).length;
  return {doneWeek:doneWeek,todayDone:todayDone,todayAll:todayAll.length,over:over};
}

  if(a==='autostart'||a==='battery'||a==='popup'){
    if(NATIVE&&NATIVE.openVendorPerm){try{NATIVE.openVendorPerm(a)}catch(e){}}
    else toast('网页版没有这个设置');
    return;
  }
  if(a==='onehand'){setOneHand(!oneHand());return}
  if(a==='wrapup'){setWrapupOn(!wrapupOn());return}
  if(a==='snd'){setSoundOn(!soundOn());toast(soundOn()?'完成音效已开':'完成音效已关');return}

/* ---------- 剪贴板批量导入 ---------- */
function parseLines(text){
  return (text||'').split(/\r?\n/).map(function(x){
    return x.replace(/^\s*(?:[-—*•·●○]|\d+\s*[.、)）]|[（(]\d+[)）])\s*/,'').trim();
  }).filter(function(x){return x.length>0&&x.length<=80}).slice(0,30);
}
function getClip(cb){
  if(NATIVE&&NATIVE.readClipboard){try{cb(NATIVE.readClipboard()||'');return}catch(e){}}
  if(navigator.clipboard&&navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(t){cb(t||'')}).catch(function(){cb('')});
    return;
  }
  cb('');
}
function openPaste(){
  if(document.getElementById('dlg'))return;
  getClip(function(text){
    var lines=parseLines(text);
    if(!lines.length){toast('剪贴板里没找到可用的行');return}
    var d=document.createElement('dialog');
    d.id='dlg';
    d.innerHTML='<h3 style="margin:0 0 6px">从剪贴板导入</h3>'+
      '<div class="hint" style="margin-top:0">识别到 '+lines.length+' 条，取消勾选不要的。日期和时间会按文字自动识别。</div>'+
      '<div class="plist">'+lines.map(function(x,i){
        var p=parseQuick(x);
        var lbl=(p.date?dayLabel(p.date)+' ':'')+(p.time?fmtT(p.time):'')||'今天';
        return '<label class="prow"><input type="checkbox" checked data-pi="'+i+'">'+
          '<span class="pt">'+esc(x)+'</span><span class="pv">'+esc(lbl)+'</span></label>';
      }).join('')+'</div>'+
      '<div class="btns" style="margin-top:14px"><button class="b-main" id="pOk">加入</button>'+
      '<button class="b-ghost" id="pNo">取消</button></div>';
    stageEl().appendChild(d);
    try{d.showModal()}catch(e){d.setAttribute('open','')}
    var close=function(){try{d.close()}catch(e){}d.remove()};
    d.querySelector('#pNo').onclick=close;
    d.querySelector('#pOk').onclick=function(){
      var n=0;
      [].forEach.call(d.querySelectorAll('[data-pi]'),function(cb){
        if(!cb.checked)return;
        var raw=lines[+cb.dataset.pi];
        var p=parseQuick(raw);
        tasks.push({id:uid(),title:(p.clean||raw).slice(0,120),cat:p.cat||'life',note:'',color:'',
          dueDate:p.date||today(),dueTime:p.time||'',remindDate:p.time?(p.date||today()):'',
          remindTime:p.time||'',early:0,done:false,doneDate:'',deferred:0,origDue:'',
          createdAt:Date.now()+n,order:Date.now()+n,notified:false,repeat:null,spawned:'',subs:[]});
        n++;
      });
      if(!n){toast('一条都没选');return}
      save();close();render();toast('已加入 '+n+' 条');
    };
    d.addEventListener('click',function(e){if(e.target===d)close()});
  });
}
