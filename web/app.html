/* ---------- 长按拖动排序（跟手悬浮层 + 帧合并 + 边缘自动滚动 + FLIP） ---------- */
var drag=null, HOLD=420, justDragged=0;

function applyOrder(){
  var rows=[].slice.call(document.querySelectorAll('#view .row'));
  var i=0;
  rows.forEach(function(r){
    var t=tasks.find(function(x){return x.id===r.dataset.id});
    if(t&&!t.done){t.order=i*100;i++}
  });
  save();
}
function siblingRows(sec){
  return [].slice.call(sec.children).filter(function(n){
    return n.classList&&n.classList.contains('row');
  });
}
/* FLIP：先记录旧位置，移动 DOM 后用 transform 过渡到新位置，邻居平滑补位 */
function flipMove(sec,row,ref){
  var rows=siblingRows(sec), first={}, moving=[];
  rows.forEach(function(r){first[r.dataset.id]=r.offsetTop});
  sec.insertBefore(row,ref);
  rows.forEach(function(r){
    var d=first[r.dataset.id]-r.offsetTop;
    if(!d)return;
    r.style.transition='none';
    r.style.transform='translateY('+d+'px)';
    moving.push(r);
  });
  if(!moving.length)return;
  void sec.offsetHeight;                      /* 强制回流，让起始状态生效 */
  moving.forEach(function(r){
    r.style.transition='transform .18s cubic-bezier(.22,1,.36,1)';
    r.style.transform='translateY(0)';
  });
  moving.forEach(function(r){
    clearTimeout(r._flipT);
    r._flipT=setTimeout(function(){r.style.transition='';r.style.transform=''},250);
  });
}
function dragActivate(){
  var d=drag;
  if(!d||d.active)return;
  var el=d.row, rect=el.getBoundingClientRect();
  var gh=el.cloneNode(true);
  gh.classList.remove('ghost-on');
  gh.classList.add('drag-ghost');
  gh.style.left=rect.left+'px';
  gh.style.top=rect.top+'px';
  gh.style.width=rect.width+'px';
  gh.style.height=rect.height+'px';
  document.body.appendChild(gh);
  d.ghost=gh; d.sec=el.parentNode; d.active=true; d.swaps=0;
  el.classList.add('ghost-on');
  try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}
  try{NATIVE&&NATIVE.buzz&&NATIVE.buzz()}catch(e){}
  d.raf=requestAnimationFrame(dragTick);
}
function dragTick(){
  var d=drag;
  if(!d||!d.active)return;
  d.ghost.style.transform='translate3d(0,'+(d.lastY-d.y0)+'px,0) scale(1.015)';
  var vh=window.innerHeight, sp=0;
  if(d.lastY<vh*0.16)sp=-Math.min(15,(vh*0.16-d.lastY)/2.2);
  else if(d.lastY>vh*0.84)sp=Math.min(15,(d.lastY-vh*0.84)/2.2);
  if(sp)scrollByY(sp);
  dragReorder(d);
  d.raf=requestAnimationFrame(dragTick);
}
function dragReorder(d){
  var rows=siblingRows(d.sec).filter(function(r){return r!==d.row});
  if(!rows.length)return;
  var ref=null, i;
  for(i=0;i<rows.length;i++){
    var r=rows[i].getBoundingClientRect();
    if(d.lastY<r.top+r.height/2){ref=rows[i];break}
  }
  if(ref){
    if(d.row.nextElementSibling===ref)return;
  }else{
    if(d.row===rows[rows.length-1])return;
  }
  flipMove(d.sec,d.row,ref);
  d.swaps++;
  try{navigator.vibrate&&navigator.vibrate(7)}catch(e){}
}
function dragEnd(){
  var d=drag;
  if(!d)return;
  drag=null;
  if(d.timer)clearTimeout(d.timer);
  if(!d.active)return;
  if(d.raf)cancelAnimationFrame(d.raf);
  if(d.ghost&&d.ghost.parentNode)d.ghost.parentNode.removeChild(d.ghost);
  d.row.classList.remove('ghost-on');
  [].forEach.call(d.sec.querySelectorAll('.row'),function(r){
    r.style.transition='';r.style.transform='';
  });
  justDragged=Date.now();
  if(!d.swaps)return;                         /* 没换位就别重建列表 */
  applyOrder();
  render();
  toast('顺序已保存');
}
/* ---------- 手势：纵向长按拖动排序 / 横向右滑延到明天 ---------- */
function scroller(){return oneHand()?document.getElementById('stage'):window}
function scrollTop0(){
  var sc=scroller();
  try{
    if(sc===window)window.scrollTo({top:0,behavior:'smooth'});
    else sc.scrollTo({top:0,behavior:'smooth'});
  }catch(e){ if(sc===window)window.scrollTop=0; else sc.scrollTop=0; }
}
function scrollByY(dy){
  var sc=scroller();
  if(sc===window)window.scrollBy(0,dy); else sc.scrollTop+=dy;
}
var swipe=null, swipeRaf=0;
/* 每帧只写一次 transform：中间连续 move 不触发重排，定住也不抖 */
function paintSwipe(){
  swipeRaf=0;
  var sw=swipe;
  if(!sw||!sw.moved)return;
  var pull=Math.min(sw.dx,120);
  sw.row.style.transform='translate3d('+pull+'px,0,0)';
  sw.row.style.opacity=String(Math.max(.5,1-sw.dx/520));
}
document.addEventListener('touchstart',function(e){
  if(e.touches.length!==1)return;
  var el=e.target.closest?e.target.closest('.row'):null;
  if(!el||e.target.closest('button')||e.target.closest('.subrow'))return;
  var x=e.touches[0].clientX, y=e.touches[0].clientY;
  var task=tasks.filter(function(v){return v.id===el.dataset.id})[0];
  swipe={row:el,task:task,x0:x,y0:y,dx:0,moved:false,
         can:!!(task&&task.cat!=='long'&&!task.done&&task.dueDate)};
  if(el.classList.contains('done')||siblingRows(el.parentNode).length<2)return;
  drag={row:el,y0:y,lastY:y,active:false,timer:null,scrollY:scroller().scrollTop};
  drag.timer=setTimeout(dragActivate,HOLD);
},{passive:true});
document.addEventListener('touchmove',function(e){
  var x=e.touches[0].clientX, y=e.touches[0].clientY;
  if(swipe&&!swipe.moved&&swipe.can){
    var dx=x-swipe.x0, dy=y-swipe.y0;
    if(dx>14&&Math.abs(dx)>Math.abs(dy)*1.2){
      swipe.moved=true;
      if(drag){clearTimeout(drag.timer);drag=null}
      swipe.row.classList.add('swiping');
      try{navigator.vibrate&&navigator.vibrate(8)}catch(err){}
    }
  }
  if(swipe&&swipe.moved){
    swipe.dx=Math.max(0,x-swipe.x0);
    if(!swipeRaf)swipeRaf=requestAnimationFrame(paintSwipe);
    e.preventDefault();
    return;
  }
  var d=drag;
  if(!d)return;
  if(!d.active){
    if(Math.abs(y-d.y0)>10||Math.abs(scroller().scrollTop-d.scrollY)>3){
      clearTimeout(d.timer);drag=null;
    }
    return;
  }
  d.lastY=y;
  e.preventDefault();
},{passive:false});
function swipeEnd(){
  var sw=swipe; swipe=null;
  if(swipeRaf){cancelAnimationFrame(swipeRaf);swipeRaf=0}
  if(!sw||!sw.moved)return;
  var row=sw.row, t=sw.task;
  row.classList.remove('swiping');
  row.style.transform='';
  row.style.opacity='';
  justDragged=Date.now();             /* 别让松手后的 click 又打开面板 */
  if(sw.dx<72||!t)return;
  var od=t.dueDate, orr=t.remindDate, oetime=t.remindTime;
  var nd=addDays(t.dueDate,1);
  t.dueDate=nd;
  if(t.remindDate)t.remindDate=addDays(t.remindDate,1);
  save();render();
  toastAction('已延到「'+dayLabel(nd)+'」','撤销',function(){
    t.dueDate=od;t.remindDate=orr;t.remindTime=oetime;save();render();
  },4000);
  try{navigator.vibrate&&navigator.vibrate(12)}catch(err){}
}
function gestureEnd(){swipeEnd();dragEnd()}
document.addEventListener('touchend',gestureEnd);
document.addEventListener('touchcancel',gestureEnd);


/* ---------- 批量选择 ---------- */
var selecting=false, selIds=[];
function enterSelect(){
  selecting=true; selIds=[];
  document.documentElement.classList.add('selecting');
  render();
}
function exitSelect(){
  selecting=false; selIds=[];
  document.documentElement.classList.remove('selecting');
  renderSelBar();
  render();
}
function toggleSelId(id){
  var i=selIds.indexOf(id);
  if(i>=0)selIds.splice(i,1); else selIds.push(id);
  var row=document.querySelector('#view .row[data-id="'+id+'"]');
  if(row)row.classList.toggle('sel',selIds.indexOf(id)>=0);
  renderSelBar();
}
function renderSelBar(){
  var bar=document.getElementById('selbar');
  if(!selecting){if(bar)bar.remove();return}
  if(!bar){
    bar=document.createElement('div');
    bar.id='selbar';
    stageEl().appendChild(bar);
  }
  var n=selIds.length;
  bar.innerHTML='<span class="ck">已选 '+n+' 条</span>'+
    '<button data-sb="all">全选</button>'+
    '<button data-sb="done" class="pri">完成</button>'+
    '<button data-sb="move">改期</button>'+
    '<button data-sb="del" class="danger">删除</button>'+
    '<button data-sb="exit">取消</button>';
  [].forEach.call(document.querySelectorAll('#view .row[data-id]'),function(r){
    r.classList.toggle('sel',selIds.indexOf(r.dataset.id)>=0);
  });
}
function selTasks(){
  return selIds.map(function(id){return tasks.filter(function(x){return x.id===id})[0]}).filter(Boolean);
}
function selAction(k){
  if(k==='exit'){exitSelect();return}
  if(k==='all'){
    var rows=[].slice.call(document.querySelectorAll('#view .row[data-id]'));
    selIds=rows.map(function(r){return r.dataset.id});
    renderSelBar();return;
  }
  var picked=selTasks();
  if(!picked.length){toast('先点几条任务');return}
  if(k==='done'){
    var n=0;
    picked.forEach(function(t){if(!t.done){t.done=true;t.doneDate=today();t.notified=true;n++}});
    save();exitSelect();toast('已完成 '+n+' 条');
    return;
  }
  if(k==='move'){
    openMoveDate(function(ds){
      picked.forEach(function(t){pushHist(t,'改期',t.dueDate,ds);t.dueDate=ds});
      save();exitSelect();toast('已改到「'+dayLabel(ds)+'」');
    });
    return;
  }
  if(k==='del'){
    var removed=picked.map(function(t){return {t:t,i:tasks.indexOf(t)}});
    removed.sort(function(a,b){return b.i-a.i}).forEach(function(r){tasks.splice(r.i,1)});
    save();exitSelect();
    toastAction('已删除 '+removed.length+' 条','撤销',function(){
      removed.slice().sort(function(a,b){return a.i-b.i}).forEach(function(r){tasks.splice(r.i,0,r.t)});
      save();render();
    },5000);
    return;
  }
}
function openMoveDate(cb){
  var d=document.createElement('dialog');
  d.innerHTML='<h3 style="margin:0 0 4px">改到哪天</h3>'+
    '<div class="hint" style="margin-top:2px">选中的任务一起改期。</div>'+
    '<input type="date" id="mDate" value="'+addDays(today(),1)+'">'+
    '<div class="quick" style="margin-top:12px">'+
    '<button data-mj="0">今天</button><button data-mj="1">明天</button>'+
    '<button data-mj="7">一周后</button></div>'+
    '<div class="btns" style="margin-top:14px"><button class="b-ghost" id="mCancel">取消</button>'+
    '<button class="b-main" id="mOk">确定</button></div>';
  stageEl().appendChild(d);
  try{d.showModal()}catch(e){d.setAttribute('open','')}
  var input=d.querySelector('#mDate');
  [].forEach.call(d.querySelectorAll('[data-mj]'),function(b){
    b.onclick=function(){input.value=addDays(today(),+b.dataset.mj)};
  });
  d.querySelector('#mCancel').onclick=function(){try{d.close()}catch(e){}d.remove()};
  d.querySelector('#mOk').onclick=function(){
    var v=input.value;try{d.close()}catch(e){}d.remove();
    if(v)cb(v);
  };
}

/* ---------- 任务足迹 ---------- */
function pushHist(t,kind,from,to){
  if(!t)return;
  if(!t.hist)t.hist=[];
  t.hist.push({d:today(),k:kind,f:from||'',t:to||''});
  if(t.hist.length>20)t.hist=t.hist.slice(-20);
}
function renderHist(t){
  var box=document.getElementById('fHist');
  if(!box)return;
  if(!t||!t.hist||!t.hist.length){box.innerHTML='';box.style.display='none';return}
  box.style.display='block';
  var lines=t.hist.slice(-6).reverse().map(function(h){
    return '<div class="hrow"><span>'+h.d.slice(5)+'</span>'+
      (h.k==='顺延'?'顺延到 ':'改到 ')+h.t+'</div>';
  }).join('');
  box.innerHTML='<label class="f">足迹（最近 '+Math.min(t.hist.length,6)+' 次）</label><div class="hist">'+lines+'</div>';
}

/* ---------- Toast ---------- */
var toastTimer=null, toastAct=null;
function toast(msg){
  var el=document.getElementById('toast');
  toastAct=null;
  el.className='toast on';
  el.textContent=msg;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.className='toast';el.textContent=''},2200);
}
/* 带「撤销」按钮的提示条，默认 5 秒后自动消失 */
function toastAction(msg,label,cb,ms){
  var el=document.getElementById('toast');
  toastAct=null;
  el.className='toast on act';
  el.innerHTML='<span>'+esc(msg)+'</span><button type="button" id="toastActBtn">'+esc(label)+'</button>';
  var btn=el.querySelector('#toastActBtn');
  btn.onclick=function(ev){
    ev.stopPropagation();
    clearTimeout(toastTimer);
    el.className='toast';el.innerHTML='';
    if(toastAct)toastAct();
  };
  toastAct=cb;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.className='toast';el.textContent='';toastAct=null},ms||5000);
}

/* ---------- 事件 ---------- */
document.addEventListener('click',function(e){
  if(Date.now()-justDragged<350)return;      /* 刚拖动过，别把松手当成点击 */
  var el=e.target.closest('[data-tpl],[data-chk],[data-subchk],[data-subtoggle],[data-edit],[data-tab],[data-filter],[data-act],[data-cat],[data-date],[data-color],[data-early],[data-mode],[data-theme],[data-sb],[data-yr],[data-wrapup]');
  if(el&&el.dataset.sb){selAction(el.dataset.sb);return}
  if(!el){
    if(selecting){
      var srow=e.target.closest?e.target.closest('#view .row[data-id]'):null;
      if(srow){toggleSelId(srow.dataset.id);return}
      return;
    }
    /* 点整行（不是勾选框/按钮/子任务）＝打开编辑 */
    var rowEl=e.target.closest?e.target.closest('#view .row[data-id]'):null;
    if(rowEl&&!e.target.closest('button')&&!e.target.closest('.subrow')){
      var rt=tasks.filter(function(x){return x.id===rowEl.dataset.id})[0];
      if(rt)openSheet(rt);
    }
    return;
  }
  if(el.dataset.act==='menu'){openDrawer();return}
  if(el.dataset.tpl!=null){addTpl(el.dataset.tpl);return}
  if(el.dataset.act==='clearover'){
    tasks.forEach(function(x){if(x.cat!=='long'&&!x.done&&(x.deferred>0||(x.origDue&&x.origDue<today()))){x.deferred=0;x.origDue='';}});
    save();render();toast('已顺延到今天');return;
  }
  if(el.dataset.chk){toggle(el.dataset.chk);return}
  if(el.dataset.subchk){
    var sp=el.dataset.subchk.split(':');
    var pt=tasks.find(function(x){return x.id===sp[0]});
    var psb=pt&&pt.subs?pt.subs.find(function(x){return x.id===sp[1]}):null;
    if(psb){
      psb.done=!psb.done;
      save();
      var oldRow=document.querySelector('#view .row[data-id="'+pt.id+'"]');
      if(!patchSubRow(pt)&&oldRow)render();
    }
    return;
  }
  if(el.dataset.subtoggle){
    var ptg=tasks.find(function(x){return x.id===el.dataset.subtoggle});
    if(ptg&&ptg.subs&&ptg.subs.length){
      var wasOpen=(ptg.subsOpen!==false);
      ptg.subsOpen=!wasOpen;save();render();
    }
    return;
  }
  if(el.dataset.edit){
    var t=tasks.find(function(x){return x.id===el.dataset.edit});
    if(t)openSheet(t);
    return;
  }
  if(el.dataset.tab){
    if(el.dataset.tab===tab){scrollTop0();return}   /* 再点当前 tab = 回顶 */
    tab=el.dataset.tab;
    if(tab==='today')filter='today';
    render();
    scrollTop0();
    return;
  }
  if(el.dataset.yr){shareYearReport(statYear||+today().slice(0,4));return}
  if(el.dataset.date){selectDate(el.dataset.date);return}
  if(el.dataset.filter){filter=el.dataset.filter;render();return}
  if(el.dataset.cat){draftCat=el.dataset.cat;syncCats();return}
  if(el.dataset.theme){setTheme(el.dataset.theme);return}
  if(el.dataset.early!==undefined&&el.closest('#fEarly')){draftEarly=+el.dataset.early;syncEarly();return}
  if(el.dataset.mode!==undefined&&el.closest('#fMode')){draftMode=el.dataset.mode;syncMode();return}
  if(el.dataset.color!==undefined&&el.closest('#fColor')){draftColor=el.dataset.color;syncColors();return}
  if(el.dataset.act){
    if(el.dataset.act==='notify')askNotify();
    else if(el.dataset.act==='stats')openStats();
    else if(el.dataset.act==='search')openSearch();
    else if(el.dataset.act==='ical'){
      exportCal(tasks.filter(function(x){return !x.done&&(x.remindDate||x.dueDate)}),'今日之后提醒.ics');
    }
    else if(el.dataset.act==='jump')openJump();
    else if(el.dataset.act==='batch')enterSelect();
    else if(el.dataset.act==='today')selectDate(today());
    else if(el.dataset.act==='perm'){openGuide(false);}
    else if(el.dataset.act==='data')openData();
    return;
  }
});

document.getElementById('fRepeat').addEventListener('click',function(e){
  var b=e.target.closest('[data-rep]');if(!b)return;
  draftRepeat=b.dataset.rep;
  if(draftRepeat==='weekly'&&!draftDow.length){
    var dd=new Date().getDay();
    if(dd!==0&&dd!==6)draftDow=[dd];
  }
  if(draftRepeat==='weekly'&&draftDow.length===1){
    var dd2=draftDow[0];
    if(dd2===0||dd2===6)draftDow=[1,3,5];
  }
  syncRepeat();
});
document.getElementById('fDow').addEventListener('click',function(e){
  var b=e.target.closest('[data-dow]');if(!b)return;
  var v=+b.dataset.dow, i=draftDow.indexOf(v);
  if(i>=0)draftDow.splice(i,1);else draftDow.push(v);
  syncRepeat();
});
document.getElementById('fDom').addEventListener('change',function(){draftDom=+this.value});
document.getElementById('bAddSub').addEventListener('click',addSub);
document.getElementById('fSubIn').addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.keyCode===13){e.preventDefault();addSub()}
});
document.getElementById('fSubs').addEventListener('click',function(e){
  var b=e.target.closest('[data-sact]');if(!b)return;
  var i=+b.dataset.si,it=draftSubs[i];if(!it)return;
  if(b.dataset.sact==='toggle')it.done=!it.done;
  else draftSubs.splice(i,1);
  renderSubs();
});
document.getElementById('fTitle').addEventListener('input',function(){
  var pv=document.getElementById('qPreview');if(!pv)return;
  var v=this.value.trim();
  if(!v){pv.style.display='none';return}
  var q=parseQuick(v);
  if(!q.pills.length){pv.style.display='none';return}
  /* 识别到就实时填进输入框，所见即所得 */
  if(q.date){var de=document.getElementById('fDate');if(de)de.value=q.date}
  if(q.time){var te=document.getElementById('fTime');if(te)te.value=q.time;}
  syncPh();
  if(q.cat&&!editing&&tab==='today'&&draftCat!==q.cat){draftCat=q.cat;syncCats()}
  pv.style.display='block';
  pv.innerHTML='已识别 '+q.pills.join(' · ');
});
['fTime','fRTime'].forEach(function(id){
  document.getElementById(id).addEventListener('input',syncPh);
  document.getElementById(id).addEventListener('change',syncPh);
});
document.getElementById('fab').addEventListener('click',function(){openSheet(null)});
document.querySelector('.quick').addEventListener('click',function(e){
  var b=e.target.closest('[data-q]');if(!b)return;
  var q=b.dataset.q, d=new Date(), t;
  if(q==='now'||q==='now2'){
    d=new Date(Date.now()+(q==='now'?60000:2000));
    t=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  }else{
    t=q+':00';
    if(!document.getElementById('fDate').value)document.getElementById('fDate').value=today();
  }
  document.getElementById('fRDate').value=today();
  document.getElementById('fRTime').value=t;
  if(!document.getElementById('fDate').value)document.getElementById('fDate').value=today();
  syncPh();
  toast('提醒设为 '+t);
});
document.getElementById('bPickRing').addEventListener('click',function(){
  ringTarget='task';
  if(NATIVE&&NATIVE.pickRingtone){try{NATIVE.pickRingtone(draftSound||globalSound());return}catch(e){}}
  toast('网页版没有铃声选择器');
});
document.getElementById('bTryRing').addEventListener('click',function(){
  if(NATIVE&&NATIVE.previewRing){try{NATIVE.previewRing(draftSound||globalSound());return}catch(e){}}
  toast('网页版不能试听');
});
document.getElementById('bDefRing').addEventListener('click',function(){
  draftSound='';syncRingRow();toast('这条任务用默认铃声');
});
document.getElementById('mask').addEventListener('click',closeSheet);
document.getElementById('bSave').addEventListener('click',function(){
  var title=document.getElementById('fTitle').value.trim();
  if(!title){toast('先写点什么');return}
  var parsed=parseQuick(title);
  if(parsed.clean&&parsed.clean!==title)title=parsed.clean;
  var dueDate=document.getElementById('fDate').value;
  var dueTime=document.getElementById('fTime').value;
  if(parsed.date)dueDate=parsed.date;          /* 文字里写了日期就以文字为准 */
  if(parsed.time)dueTime=parsed.time;
  if(!editing&&parsed.cat&&tab==='today'&&draftCat!==parsed.cat)draftCat=parsed.cat;
  var rDate=document.getElementById('fRDate').value;
  var rTime=document.getElementById('fRTime').value;
  if(rDate&&!rTime)rTime='09:00';
  if(dueDate&&!dueTime)dueTime='';
  var obj= editing?editing : {id:uid(),createdAt:Date.now(),done:false};
  var oldDue=editing?(editing.dueDate||''):'';
  obj.title=title;obj.cat=draftCat;obj.color=draftColor||'';obj.early=draftEarly||0;obj.sound=draftSound||'';obj.mode=draftMode||'alarm';obj.note=document.getElementById('fNote').value.trim();
  obj.dueDate=dueDate||'';obj.dueTime=dueTime||'';
  if(editing&&oldDue&&obj.dueDate&&oldDue!==obj.dueDate)pushHist(obj,'改期',oldDue,obj.dueDate);
  obj.remindDate=rDate||'';obj.remindTime=rTime||'';
  if(draftRepeat==='weekly'&&!draftDow.length){toast('每周重复至少选一天');return}
  obj.repeat = !draftRepeat?null
    : draftRepeat==='daily'?{type:'daily'}
    : draftRepeat==='weekly'?{type:'weekly',dow:draftDow.slice().sort()}
    : {type:'monthly',dom:+document.getElementById('fDom').value||1};
  if(obj.repeat&&!obj.dueDate)obj.dueDate=today();
  obj.subs = draftSubs.filter(function(x){return x.text&&x.text.trim()});
  if(obj.repeat&&!editing&&!obj.repeatNotice){obj.repeatNotice=1}
  if(!editing){obj.order=Date.now();tasks.push(obj)}
  if(rDate){obj.notified=false}
  save();closeSheet();render();schedulePrecise();
  toast(editing?'已保存':'已添加');
});
function deleteTask(t){
  var idx=tasks.findIndex(function(x){return x.id===t.id});
  if(idx<0)return;
  var removed=tasks[idx];
  tasks.splice(idx,1);
  save();closeSheet();render();schedulePrecise();
  toastAction('已删除「'+(removed.title.length>12?removed.title.slice(0,12)+'…':removed.title)+'」','撤销',function(){
    tasks.splice(Math.min(idx,tasks.length),0,removed);
    save();render();schedulePrecise();
    toast('已恢复');
  },5000);
}
document.getElementById('bDel').addEventListener('click',function(){
  if(!editing)return;
  deleteTask(editing);
});

initRingNames();

rollover(true);
syncNative();
syncWrapup();
render();
maybeBackup();

drainNative();
/* 数据就绪 → 交给开屏去收尾（完整模式下显示「今天 x/y」） */
(function(){
  if(!NATIVE||!NATIVE.splashDone)return;
  var t=today(), all=tasks.filter(function(x){return x.cat!=='long'&&x.dueDate===t});
  var dn=all.filter(function(x){return x.done}).length;
  try{NATIVE.splashDone('今天 '+dn+'/'+all.length)}catch(e){}
})();
setInterval(checkReminders,20000);
setInterval(dayTick,30000);
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){rollover(true);render();checkReminders();schedulePrecise();drainNative()}
});
})();
